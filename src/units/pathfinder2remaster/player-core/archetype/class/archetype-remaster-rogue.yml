unit: archetype/remaster/rogue
in: archetype
group: "_{Player Core}"
name: "_{Rogue}"
multiclass: true

require:
  - unit: defs/archetypes
  - deny: archetype/rogue

inc:
  - set: rogue-class-dc-proficiency
    value: trained

  - at: '@archetypes'
    add:
      - name: "_{Rogue}"
        num-feats: 3

  - at: '@pages'
    add:
      - page: archetype-rogue
        name: "_{Rogue}"
        order: 26
        flex: true
        half: true
        contents:
          - layout: 2e
            contents:
              - g:
                contents:
                  - g:
                    flex: tiny
                    contents:
                      - class-icon: rogue
                      - class-name: "_{Rogue}"
                  - section: "_{Dedication}"
                    contents:
                      - p: "_{Trained in Stealth or Thievery, plus one skill}"
                        icon: proficiency-trained
                      - p: "_{Trained in light armour}"
                        icon: proficiency-trained
                      - p: "_{Gain a skill feat}"
                      - hr:
                      - g:
                        pad: true
                        contents:
                          - paste: class-dc
                            params:
                              id: rogue-class-dc
                              legend: "_{Rogue\nClass DC}"
                              misc: false
                      - hr:
                      - p:
                        title: "_{Surprise Attack}"
                        content: "_{On the first round of combat, if you roll [skill]Deception[/skill] or [skill]Stealth[/skill] for initiative, creatures that haven't acted are [effect]off-guard[/effect] to you.}"

                  - section: "_{Archetype Feats}"
                    contents:
                      - list:
                        hr: true
                        contents:
                          - article: "##:sneak-attacker"
                            title: "_{Sneak Attacker}"
                            cat: "_{Feat} 4"
                            contents:
                              - selectable: "##:sneak-attacker"
                                contents:
                                  - row:
                                    contents:
                                      - field: "##:sneak-attacker/damage"
                                        control: value
                                        value: "_{1d4}"
                                        icon: d4
                                        frame: none
                                      - p: "_{Precision damage}"
                                  - p: "_{When you attack an [effect]off-guard[/effect] opponent with an [trait]agile[/trait] or [trait]finesse[/trait] weapon or unarmed [action]strike[/action], or a ranged weapon.}"
                                  - hr:
                                    light: true
                                  - level: 6
                                    contents:
                                      - row:
                                        contents:
                                          - field: "##:sneak-attacker/damage-6"
                                            control: value
                                            value: "_{1d6}"
                                            icon: d6
                                            frame: none
                                          - p: "_{Precision damage}"

                          - article: "##:skill-mastery"
                            title: "_{Skill Mastery}"
                            cat: "_{Feat} 8"
                            contents:
                              - row:
                                contents:
                                  - field: "##:skill-mastery/taken"
                                    control: checkgrid
                                    max: 5
                                    depth: 1
                                    frame: none
                                  - p: "_{Up to five times}"
                              - row:
                                contents:
                                  - icon: proficiency-expert
                                  - span: "&rarr;"
                                  - icon: proficiency-master
                                  - p: "_{One skill}"
                                  - spacer:
                                  - icon: proficiency-trained
                                  - span: "&rarr;"
                                  - icon: proficiency-expert
                                  - p: "_{Another skill}"
                              - p: "_{Also gain a skill feat for one of them.}"

                          - article: "##:uncanny-dodge"
                            title: "_{Uncanny Dodge}"
                            cat: "_{Feat} 10"
                            contents:
                              - selectable: "##:uncanny-dodge"
                                contents:
                                  - p: "_{Not [effect]off-guard[/effect] to [effect]hidden[/effect], [effect]undetected[/effect] or flanking creatures of your level or lower, or their surprise attacks. They can still help allies flank.}"

                          - article: "##:evasiveness"
                            title: "_{Evasiveness}"
                            cat: "_{Feat} 12"
                            contents:
                              - selectable: "##:evasiveness"
                                contents:
                                  - row:
                                    contents:
                                      - icon: proficiency-expert
                                      - span: "&rarr;"
                                      - icon: proficiency-master
                                  - p: "_{Become master in Reflex saves}"

                  - tail:
                  - spacer:
                    flex: huge

              - g:
                contents:
                  - section: "_{Trickery}"
                    mark: rogue
                    contents:
                      - paste: archetype-feats
                        params:
                          id: rogue-feats
                          class-level: "_{Rogue\nLevel}"
                          basic-title: "_{Basic Trickery}"
                          advanced-title: "_{Advanced Trickery}"

                  - tail:

