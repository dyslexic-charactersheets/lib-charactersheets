unit: option/inventory/half
in: option/inventory
name: "_{Inventory (half size)}"
group: "_{Player Core}"

inc:
  - at: '@pages'
    add:
      - page: inventory
        name: "_{Inventory}"
        order: 15
        flex: true
        # landscape: true
        half: true
        contents:
          - g:
            contents:
              - layout: 2e
                contents:
                  - g:
                    contents:
                      - section: "_{Inventory}"
                        contents:
                          - list:
                            hr: true
                            contents:
                              - g:
                                merge-bottom: true
                                contents:
                                  - h5: "_{Items}"
                                  - g:
                                    mark: inventory
                                    contents:
                                      - list:
                                        zebra: true
                                        collapse: true
                                        contents:
                                          - row:
                                            contents:
                                              - field: inventory-item-1-checked
                                                frame: none
                                                control: checkbox
                                              - field: inventory-item-1
                                                width: stretch
                                              - field: inventory-item-1-value
                                                format: string
                                                label: "_{Value}"
                                              - field: inventory-item-1-weight
                                                format: string
                                                label: "_{Weight}"
                                          - repeat: 7
                                            start: 2
                                            reduce: 3
                                            contents:
                                              - row:
                                                contents:
                                                  - field: inventory-item-#{i}-checked
                                                    frame: none
                                                    control: checkbox
                                                  - field: inventory-item-#{i}
                                                    width: stretch
                                                  - field: inventory-item-#{i}-value
                                                    format: string
                                                  - field: inventory-item-#{i}-weight
                                                    format: string

                              - g:
                                id: inventory-backpack-block
                                merge-bottom: true
                                contents:
                                  - section: "_{Backpack}"
                                    primary: true
                                    mark: backpack
                                    contents:
                                      - list:
                                        zebra: true
                                        collapse: true
                                        contents:
                                          - row:
                                            contents:
                                              - field: inventory-backpack-1
                                                width: stretch
                                              - field: inventory-backpack-1-value
                                                format: string
                                                label: "_{Value}"
                                              - field: inventory-backpack-1-weight
                                                format: string
                                                label: "_{Weight}"
                                          - repeat: 4
                                            start: 2
                                            reduce: 2
                                            contents:
                                              - row:
                                                contents:
                                                  - field: inventory-backpack-#{i}
                                                    width: stretch
                                                  - field: inventory-backpack-#{i}-value
                                                    format: string
                                                  - field: inventory-backpack-#{i}-weight
                                                    format: string
                                      - hr:
                                      - zone: '@inventory/kit'
                                        contents:
                                          - list:
                                            flex: small
                                            zebra: true
                                            contents:
                                              - row:
                                                contents:
                                                  - field: inventory-kit
                                                    width: stretch
                                                    legend: "_{Kit}"
                                                  - field: inventory-kit-value
                                                    format: string
                                                    label: "_{Value}"
                                                  - field: inventory-kit-weight
                                                    format: string
                                                    label: "_{Weight}"
                                              - repeat: 2
                                                reduce: 1
                                                merge-bottom: true
                                                contents:
                                                  - field: inventory-kit-contents-#{i}
                                                    frame: none
                                                    width: stretch
                                      - row:
                                        contents:
                                          - field: weight-backpack-ignore
                                            control: value
                                            value: "-2"
                                            frame: none
                                            width: tiny
                                          - p: "_{Bulk}"
                                          - spacer:
                                          - field: weight-backpack-total
                                            frame: left
                                            label: ""
                                            border: full
                                            control: weight

                              - g:
                                contents:
                                  - h5: "_{Expendables}"
                                  - list:
                                    zebra: true
                                    collapse: true
                                    field_frame: none
                                    merge-bottom: true
                                    contents:
                                      - repeat: 2
                                        contents:
                                          - row:
                                            contents:
                                              - field: expendable-#{i}
                                                width: stretch
                                              - field: expendable-#{i}-count
                                                frame: none
                                                control: checkgrid
                                                max: 20
                                                depth: 3

                              - g:
                                pad: true
                                flex: none
                                contents:
                                  - row:
                                    contents:
                                      - field: gold-total
                                        frame: left
                                        label: "_{Total wealth}"
                                        suffix: "_{gp}"
                                        border: full
                                        format: decimal
                                        width: gargantuan
                                      - spacer:
                                  - row:
                                    contents:
                                      - field: weight-total
                                        frame: left
                                        label: "_{Total weight}"
                                        border: full
                                        control: weight
                                      - spacer:

                      - section: "_{Money}"
                        flex: none
                        contents:
                          - g:
                            blk: true
                            contents:
                              - field: money-platinum
                                frame: left
                                control: money
                                label: "_{Platinum}"
                                denomination: platinum
                                digits: 7
                                shift: 3
                              - field: money-gold
                                frame: left
                                control: money
                                label: "_{Gold}"
                                denomination: gold
                                digits: 8
                                shift: 2
                              - field: money-silver
                                frame: left
                                control: money
                                label: "_{Silver}"
                                denomination: silver
                                digits: 9
                                shift: 1
                              - field: money-copper
                                frame: left
                                control: money
                                label: "_{Copper}"
                                denomination: copper
                                digits: 10
                              - field: money-total
                                frame: left
                                output: 'true'
                                control: money
                                legend: "_{Total}"
                                denomination: copper
                                digits: 10
                                decimal: 1
                                eq: "(%{money-platinum}*1000)+(%{money-gold}*100)+(%{money-silver}*10)+%{money-copper}"
                      - tail:

                  - g:
                    contents:
                      - section: "_{Invested Items}"
                        id: inventory-invested
                        contents:
                          - list:
                            zebra: true
                            flex: true
                            hr: true
                            avoid-shade: true
                            contents:
                              - level: '1'
                                marker: ''
                                contents:
                                  - article: 'inventory-invested-1'
                                    no-header-line: true
                                    lines: 1
                                    header:
                                      - row:
                                        contents:
                                          - field: 'inventory-invested-1'
                                            width: stretch
                                            frame: none
                                          - field: 'inventory-invested-1-value'
                                            format: string
                                            label: "_{Value}"
                                          - field: 'inventory-invested-1-weight'
                                            format: string
                                            label: "_{Weight}"
                              - repeat: 7
                                start: 2
                                reduce: 2
                                contents:
                                  - level: '#{i}'
                                    marker: ''
                                    contents:
                                      - article: 'inventory-invested-#{i}'
                                        no-header-line: true
                                        lines: 1
                                        header:
                                          - row:
                                            contents:
                                              - field: 'inventory-invested-#{i}'
                                                width: stretch
                                                frame: none
                                              - field: 'inventory-invested-#{i}-value'
                                                format: string
                                              - field: 'inventory-invested-#{i}-weight'
                                                format: string

                      - section: "_{Armour}"
                        primary: true
                        mark: armour
                        contents:
                          - row:
                            layout: split
                            contents:
                              - field: armour
                                frame: none
                                size: large
                                width: stretch
                              - field: armour-bulk
                                label: "_{Weight}"
                                format: int
                              - field: ac-armour-bonus
                                label: "_{AC Bonus}"
                                icon: armour
                                border: full
                                format: int
                                colour: DEX
                              - field: ac-armour-potency
                                control: counter
                                label: "_{Potency}"
                          - row:
                            layout: split
                            contents:
                              - field: armour-cat
                                label: "_{Category}"
                                width: stretch
                              - field: armour-dex-cap
                                label: "_{DEX\nCap}"
                                format: int
                                colour: DEX
                                width: small
                              - field: armour-str-rating
                                label: "_{Strength\nRating}"
                                format: int
                                # prefix: "+"
                                colour: STR
                                width: small
                              - field: armour-acp
                                label: "_{Check\nPenalty}"
                                border: full
                                prefix: "&ndash;"
                                format: int
                                width: small
                              - zone: '@inventory/armour-speed-penalty'
                                contents:
                                  - field: armour-speed-penalty
                                    label: "_{Speed\nPenalty}"
                                    width: large
                                    prefix: "&ndash;"
                                    suffix: "_{ft}"
                                    format: int
                          - field: armour-properties
                            width: stretch
                            label: "_{Armour Traits}"
                            frame: annotation
                            repeat: 2
                            reduce: 1
                            # merge-bottom: true
                          - row:
                            contents:
                              - field: armour-flexible
                                control: checkbox
                                frame: right
                                label: "_{Flexible}"
                                
                              - field: armour-noisy
                                control: checkbox
                                frame: right
                                label: "_{Noisy}"

                      - section: "_{Shield}"
                        mark: shield
                        contents:
                          - row:
                            layout: split
                            contents:
                              - field: shield
                                frame: none
                                size: large
                                width: stretch
                              - field: shield-bulk
                                label: "_{Weight}"
                                format: int
                              - field: shield-ac
                                label: "_{AC Bonus}"
                                icon: shield
                                border: full
                                format: int
                                colour: DEX
                          - row:
                            contents:
                              - field: shield-hardness
                                label: "_{Hardness}"
                                width: large
                                suffix: "_{hp}"
                                format: int
                              - spacer:
                              - field: shield-bt
                                label: "_{Broken}"
                                suffix: "_{hp}"
                                prefix: "&le;"
                                width: large
                                eq: "floor(%{shield-hp}/2)"
                              - spacer:
                              - field: shield-hp
                                label: "_{Hit Points}"
                                icon: hp
                                border: full
                                width: large
                                suffix: "_{hp}"
                                format: int
                                colour: CON
                          - field: shield-properties
                            width: stretch
                            label: "_{Shield Traits}"
                            frame: annotation
                            repeat: 2
                            reduce: 1
                            merge-bottom: true

                      - tail:

