unit: rogue/racket/remaster/mastermind
in: rogue/racket
group: "_{Player Core}"
name: "_{Mastermind}"

inc:
  - set: subclass
    value: "_{Mastermind}"

  - set: society-proficiency
    value: trained

  - at: '@rogue/racket'
    replace:
      - h4: "_{Mastermind}"
      - hr:
        swash: true
      - action:
        contents:
          - article:
            title: "_{Recall Knowledge}"
            contents:
              - p: "_{If you successfully identify a creature using Recall Knowledge, that creature is off-guard against your attacks.}"
              - dl:
                div: true
                defs:
                  success: "_{Target is off-guard against your attacks until the start of your next turn.}"
                  critical_success: "_{Target is off-guard against your attacks for 1 minute.}"

      - proficiency: trained
        contents: 
          - p: "_{Society and one of: Arcana, Nature, Occultism, or Religion}"
      - ul:
        contents:
          - li: "_{May choose intelligence as your key attribute}"
