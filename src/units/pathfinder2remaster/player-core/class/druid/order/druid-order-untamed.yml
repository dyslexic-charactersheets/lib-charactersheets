unit: druid/order/remaster/untamed
in: druid/order
group: "_{Player Core}"
name: "_{Untamed}"

require:
  - unit: option/untamed-form
  
inc:
  - set: subclass
    value: "_{Untamed}"

  - set: intimidation-proficiency
    value: trained

  - at: '@druid/order'
    replace:
      - h4: "_{Untamed Order}"

  - at: '@druid/order-feat'
    replace:
      - article: "##:feat/untamed-form"
        title: "_{Untamed Form}"
        cat: "_{Feat}"
        contents:
          - p: "_{Transform yourself into another form.}"

  - at: '@focus-spells'
    add:
      - action: 2
        contents:
          - p:
            title: "_{Untamed Form}"
            content: "_{Transform yourself into another form.}"

  - at: '@untamed-form/high'
    add:
      - section: "_{Untamed Form}"
        contents:
          - table: "##:untamed-forms"
            rows:
              - duration: "10 mins"
                class: "Pest form"
              - duration: "1 min"
                class: "Other shapes"
            columns:
              - "Duration"
              - "Untamed Shapes"
            template:
              - field: druid-untamed-form-duration
                frame: none
                control: value
                value: '#{duration}'
              - p: '#{class}'

  - at: '@untamed-form/attacks'
    add:
      name: "_{Bite}"
      icon: d6
      damage: "_{1d6}"
      type: "_{Piercing}"
  - flags:
      - "_{Brawling}"
      - "_{Unarmed}"

  # - at: '@untamed-form/attacks'
  #   add:
  #     - field: druid-untamed-form-attack
  #       label: "_{When using your own attack bonus}"
  #       frame: right
  #       border: none
  #       control: value
  #       value: "+2"

  - at: '@druid/right'
    replace:
      - section: "_{Untamed Shift}"
        contents:
          - p: "_{Heighten to your focus level.}"
          - list:
            columns: 2
            merge-bottom: true
            contents:
              - repeat: 10
                reduce: 4
                contents:
                  - row:
                    contents:
                      - field: druid-untamed-form-#{i}
                        width: stretch
                        frame: none
                      - field: druid-untamed-form-#{i}-size
                        frame: none
                        icon: size

  - at: '@druid/order-power'
    replace:
      - section: "_{Untamed Shift}"
        contents:
          - list:
            hr: true
            contents:
              - list:
                hr: true
                light: true
                contents:
                  - layout: indent-l
                    contents:
                      - g:
                        align: center
                        contents:
                          - icon: action
                          - paste: focus-marker
                      - g:
                        contents:
                          - selectable: "##:untamed-shift/claws"
                            selected: true
                            contents:
                              - p: "_{Transform your hands into claws.}"
                              - paste: natural-weapon
                                params:
                                  name: "_{Claws}"
                                  icon: d6
                                  damage: "_{1d6}"
                                  type: "_{Slashing}"
                              - flags:
                                - "_{Unarmed}"
                                - "_{Agile}"
                                - "_{Finesse}"
                  - layout: indent-l
                    contents:
                      - g:
                        align: center
                        contents:
                          - icon: action
                          - paste: focus-marker
                      - g:
                        contents:
                          - selectable: "##:untamed-shift/jaws"
                            contents:
                              - p: "_{Your mouth becomes deadly jaws.}"
                              - paste: natural-weapon
                                params:
                                  name: "_{Jaws}"
                                  icon: d8
                                  damage: "_{1d8}"
                                  type: "_{Piercing}"
                              - flags:
                                  - "_{Unarmed}"
                  - layout: indent-l
                    contents:
                      - g:
                        align: center
                        contents:
                          - icon: action
                          - paste: focus-marker
                      - g:
                        contents:
                          - selectable: "##:untamed-shift/elemental"
                            contents:
                              - p: "_{Shift your body to be part elemental.}"
                              - row:
                                valign: center
                                contents:
                                  - field: druid-untamed-shift-crit-resistance
                                    frame: none
                                    control: value
                                    value: "+5"
                                  - p: "_{vs. critical hits and precision damage.}"
                  - layout: indent-l
                    contents:
                      - g:
                        align: center
                        contents:
                          - icon: action
                          - paste: focus-marker
                      - g:
                        contents:
                          - selectable: "##:untamed-shift/vines"
                            contents:
                              - p: "_{Shift your arms into vines.}"
                              - field: "##:vines/reach"
                                frame: right
                                label: "_{Reach}"
                                control: value
                                value: "_{10ft}"
                  - layout: indent-l
                    contents:
                      - g:
                        align: center
                        contents:
                          - icon: action2
                          - paste: focus-marker
                      - g:
                        contents:
                          - selectable: "##:untamed-shift/wings"
                            contents:
                              - p: "_{Grow wings from your back.}"
                              - field: "##:wings/reach"
                                frame: right
                                label: "_{Fly Speed}"
                                control: value
                                value: "_{30ft}"

              - level: 11
                contents:
                  - row:
                    valign: center
                    contents:
                      - field: "##:untamed-shift/damage-2d6"
                        frame: none
                        icon: damage
                        control: value
                        value: "+_{2d6}"
                      - p: "_{Persistent bleed or poison damage.}"
                  - p: "_{Apply two shifts at once.}"

              - level: 19
                contents:
                  - row:
                    valign: center
                    contents:
                      - field: "##:untamed-shift/damage-4d6"
                        frame: none
                        icon: damage
                        control: value
                        value: "+_{4d6}"
                      - p: "_{Persistent bleed or poison damage.}"
                  - p: "_{Apply three shifts at once.}"

  - at: '@anathema'
    replace:
      - li: "_{Becoming fully domesticated by the temptations of civilization}"