# - Arcane School system redesigned (Abjuration, Conjuration, Divination, Enchantment, Evocation, Illusion, Necromancy Transmutation -> Ars Grammatica, Battle Magic, Civic Wizardry, Mentalism, Protean Form, the School of the Boundary, and Unified Magical Theory
# - 2 curriculum cantrips + 2 curriculum spells/ per spell rank, except for Unified Magical Theory: grant a bonus 1st-level wizard feat and a 1st-rank spell + buff Drain Bonded Item
# - Metamagic trait -> Spellshape trait
# - Metamagical Experimentation -> Experimental Spellshaping
# - add: Staff Nexus thesis
# - Wizard weapon training simplified to general weapons

unit: class/remaster/wizard/reference
name: "_{Wizard Reference}"
group: "_{Player Core}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Wizard}"
      - p: >
          _{You are an eternal student of the secrets of the universe, using your mastery of
          magic to cast powerful spells. You treat magic like a science, cross-referencing the
          latest texts on practical spellcraft with ancient tomes to discover and understand
          arcane magic. Yet magical theory is vast, and there’s no way you can study it all. Most
          wizards learn through formal schooling, with their curriculum informing a specific rubric,
          although particularly driven researchers sometimes piece together their own theories.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You likely try to stay out of the fray, carefully judging when to use your spells. You
          save your most powerful magic to incapacitate threatening foes and use your cantrips
          when only weaker foes remain. When enemies pull out tricks like invisibility or flight,
          you answer with spells like glitterdust or earth bind, leveling the field for your allies}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{You provide a well of knowledge about arcane matters and solve arguments with logic.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You locate magical auras and determine the arcane significance of magical writing
          or phenomena you uncover. When you run across an unusual obstacle to further
          exploration, you probably have a scroll that will make it easier to overcome.}
          
      - paste: book-ref
        params:
          page-ref: "_{Player Core p192}"

  - at: '@reference/actions'
    add:
      - paste: reference/action-refocus
      - paste: reference/action-sustain
      - action: free
        contents:
          - p:
            title: "_{Drain Bonded Item}"
            content: "_{Cast one spell you prepared and cast today, without spending a spell slot.}"

  - at: '@reference/action-traits'
    add:
      - concentrate
      - spellshape
      - manipulate
      - fortune
