unit: defs/skill-actions
group: "_{Player Core}"

inc:

  - copy: skill-action/command-animal
    params:
      skill: "_{Nature}"
      ability: WIS
    contents:
      - action:
        contents:
          - p:
            title: "_{Command An Animal} (#{skill})"
            content: "_{Attempt a check against the target's Will DC; the GM may adjust the DC based on attitude or circumstances. Fail if the target is hostile or unfriendly.}"
            colour: "#{ability}" 

  - copy: skill-action/earn-income
    params:
      skill: "_{Lore skill}"
      ability: INT
    contents:
      - indent: left
        contents:
          - p:
            title: "_{Earn Income} (#{skill})"
            content: "_{GM sets the hidden DC of the check.}"
            colour: "#{ability}"            

  - copy: skill-action/escape
    params:
      skill: "_{Unarmed Attack}"
      ability: STR
      - action:
        contents:
          - p:
            title: "_{Escape} (#{skill})"
            content: "_{Attempt an unarmed attack against the Athletics DC of a creature grabbing you (or Thievery DC of one who tied you up). Escape if successful; move 5ft on a critical success.}"
            colour: STR

  - copy: skill-action/grapple
    params:
      skill: "_{Athletics}"
      ability: STR
      - action:
        contents:
          - p:
            title: "_{Grapple} (#{skill})"
            content: "_{Attempt an Athletics check against an enemy's Fortitude DC. If successful, enemy is grabbed; or restrained on a critical success.}"
            colour: STR

  - copy: skill-action/identify-magic
    params:
      skill: 
      ability: 
    contents:
      - paste: 10mins
        contents:
          - p:
            title: "_{Identify Magic} (#{skill})"
            content: "_{Take 10 minutes to identify a magical item, location or effect.}"
            colour: "#{ability}"

  - copy: skill-action/tumble-through
    params:
      skill: "_{Acrobatics}"
      ability: DEX
      - action:
        contents:
          - p:
            title: "_{Tumble Through} (#{skill})"
            content: "_{Attempt a check against an enemy's Reflex DC. If successful, move through their space at half speed. If you fail, trigger reactions.}"
            colour: DEX

