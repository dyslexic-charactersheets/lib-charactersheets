unit: defs/skill-actions
group: "_{Player Core}"

inc:


  - copy: skill-action/command-animal
    params:
      skill: "_{Nature}"
      ability: WIS
    contents:
      - action:
        contents:
          - p:
            title: "_{Command An Animal} (#{skill})"
            content: "_{Attempt a check against the target's Will DC; the GM may adjust the DC based on attitude or circumstances. Fail if the target is hostile or unfriendly.}"
            colour: "#{ability}" 

  - copy: skill-action/disable-a-device
    params:
      skill: "_{Thievery}"
      ability: DEX
    contents:
      - action: 2
        contents:
          - p:
            title: "_{Disable a Device} (#{skill})"
            content: "_{Achieve 1 success (2 on a critical) towards disabling a device. Thieves' tools may be required.}"
            colour: "#{ability}" 

  - copy: skill-action/earn-income
    params:
      skill: "_{Lore skill}"
      ability: INT
    contents:
      - indent: left
        contents:
          - p:
            title: "_{Earn Income} (#{skill})"
            content: "_{GM sets the hidden DC of the check.}"
            colour: "#{ability}"            

  - copy: skill-action/escape
    params:
      skill: "_{Unarmed Attack}"
      ability: STR
    contents:
      - action:
        contents:
          - p:
            title: "_{Escape} (#{skill})"
            content: "_{Attempt an unarmed attack against the Athletics DC of a creature grabbing you (or Thievery DC of one who tied you up). Escape if successful; move 5ft on a critical success.}"
            colour: STR

  - copy: skill-action/grapple
    params:
      skill: "_{Athletics}"
      ability: STR
    contents:
      - action:
        contents:
          - p:
            title: "_{Grapple} (#{skill})"
            content: "_{Attempt an Athletics check against an enemy's Fortitude DC. If successful, enemy is grabbed; or restrained on a critical success.}"
            colour: STR

  - copy: skill-action/identify-magic
    params:
      skill: 
      ability: 
    contents:
      - paste: 10mins
        contents:
          - p:
            title: "_{Identify Magic} (#{skill})"
            content: "_{Take 10 minutes to identify a magical item, location or effect.}"
            colour: "#{ability}"

  - copy: skill-action/pick-a-lock
    params:
      skill: "_{Thievery}"
      ability: DEX
    contents:
      - action: 2
        contents:
          - p:
            title: "_{Pick a Lock} (#{skill})"
            content: "_{Achieve 1 success (2 on a critical) towards opening a lock. Thieves' tools may be required.}"
            colour: "#{ability}" 
            
  - copy: skill-action/sneak
    params:
      skill: "_{Stealth}"
      ability: DEX
    contents:
      - action:
        contents:
          - p:
            title: "_{Sneak} (#{skill})"
            content: "_{Move at half speed. The GM rolls your stealth check in secret. Gain +2 from cover or +4 from greater cover. You cannot sneak without concealment.}"
            colour: "#{ability}" 

  - copy: skill-action/track
    params:
      skill: "_{Nature}"
      ability: WIS
    contents:
      - indent: left
        contents:
          - p:
            title: "_{Track} (#{skill})"
            content: "_{Move at up to half your travel speed while making checks every hour.}"
            colour: "#{ability}"

  - copy: skill-action/tumble-through
    params:
      skill: "_{Acrobatics}"
      ability: DEX
    contents:
      - action:
        contents:
          - p:
            title: "_{Tumble Through} (#{skill})"
            content: "_{Attempt a check against an enemy's Reflex DC. If successful, move through their space at half speed. If you fail, trigger reactions.}"
            colour: DEX

