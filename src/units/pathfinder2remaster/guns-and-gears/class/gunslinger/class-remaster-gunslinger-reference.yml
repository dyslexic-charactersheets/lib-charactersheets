# - Singular Expertise -> Slinger's Precision 
# - Vigilant Senses -> Perception Mastery
# - Evasion -> Blast Dodger
# - Juggernaut -> Lead Constitution
# - Incredible Senses -> Perception Legend

unit: class/remaster/gunslinger/reference
name: "_{Gunslinger Reference}"
group: "_{Guns and Gears}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Gunslinger}"
      - p: >
          _{While some fear projectile weapons, you savor the searing flash, wild kick, and
          cloying smoke that accompanies a gunshot, or snap of the cable and telltale thunk
          of your crossbow just before your bolt finds purchase. Ready to draw a bead on an
          enemy at every turn, you rely on your reflexes, steady hand, and knowledge of your
          weapons to riddle your foes with holes.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You strike from range with your firearms, seeking to defeat your opponents before
          they can pose a true threat. Depending on your choice of weapon, you might prefer to
          strike your opponent from a hidden position before they ever realize you're there,
          dash through a frenzied melee with pistols blazing, or glide effortlessly across the
          battlefield, waiting for the perfect moment to end the conflict with a single,
          well-placed shot.}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{You have a keen eye and can see things coming from farther than most. You might not
          be the life of the party, but your companions know to pay attention when your subtle
          nod or concerned grunt indicates that something's amiss.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You scout the group's position for incoming threats and help search for secret doors
          and hidden passages, keeping a weather eye out for unexpected threats.}

      - paste: book-ref
        params:
          page-ref: "_{G&G p105}"

  - at: '@reference/actions'
    add:
      - zone: '@skill-actions'

  - at: '@reference/action-traits'
    add:
      - concentrate
      - flourish
      - fortune

  - at: '@reference/weapon-traits'
    add:
      - backstabber
      - fatal
      - thrown
