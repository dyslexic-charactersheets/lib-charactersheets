unit: remaster/champion/divine-ally/blade
in: remaster/champion/divine-ally
group: "_{Player Core 2}"
name: "_{Blade Ally}"

inc:
  - set: champion-divine-ally
    value: "_{Blade Ally}"

  - at: '@champion/divine-ally'
    replace:
      - h5: "_{Blade Ally}"
      - row:
        contents:
          - field: champion-blade-ally-weapon
            label: "_{Weapon or Unarmed Attack}"
            width: stretch
          - field: champion-blade-ally-rune
            label: "_{Rune}"
            width: stretch
      - list:
        hr: true
        light: true
        contents:
          - g:
            contents:
              - selectable: "##:blade-ally/disrupting"
                contents:
                  - p:
                    title: "_{Disrupting}"
                    content: "_{Deals an extra 1d6 damage to undead; on a critical hit, an undead target is enfeebled 1 for 1 round.}"
          - g:
            contents:
              - selectable: "##:blade-ally/ghost-touch"
                contents:
                  - p:
                    title: "_{Ghost Touch}"
                    content: "_{Can harm incorporeal creatures without a penalty.}"
          - g:
            contents:
              - selectable: "##:blade-ally/returning"
                contents:
                  - p:
                    title: "_{Returning}"
                    content: "_{When thrown, flies back to your hand after the attack.}"
          - g:
            contents:
              - action:
                contents:
                  - selectable: "##:blade-ally/shifting"
                    contents:
                      - p:
                        title: "_{Shifting}"
                        content: "_{As an action, reshape it into a different melee weapon you're familiar with.}"
