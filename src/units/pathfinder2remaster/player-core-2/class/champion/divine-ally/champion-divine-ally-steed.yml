unit: remaster/champion/divine-ally/steed
in: remaster/champion/divine-ally
group: "_{Player Core 2}"
name: "_{Steed}"

require:
  - unit: option/animal-companion
  - unit: option/animal-companion/mount

inc:
  - set: champion-divine-ally
    value: "_{Steed}"

  - at: '@champion/divine-ally'
    replace:
      - h5: "_{Steed}"
      - p: "_{A wise and powerful animal companion, sent by your deity, that also serves as a mount.}"
      - row:
        contents:
          - field: champion-steed-ally-name
            label: "_{Name}"
            width: stretch
          - field: champion-steed-ally-type
            label: "_{Creature Type}"
            width: stretch
