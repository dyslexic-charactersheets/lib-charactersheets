unit: class/remaster/champion/reference
name: "_{Champion Reference}"
group: "_{Player Core 2}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Champion}"
      - p: >
          _{You are an emissary of a deity, a devoted servant who has taken up a weighty
          mantle, and you adhere to a code that holds you apart from those around you.
          You provide certainty and hope to the innocent, offering powerful defences
          that you share freely with your allies and holy power you use to end the
          threat of evil. Your devotion even attracts the attention of holy spirits
          who aid you on your journey.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You confront enemies in hand-to-hand combat while carefully positioning
          yourself to protect your allies, punishing foes who threaten them and
          calling on your divine power to turn the tide.}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{You are a voice of hope, striving to reach a peaceful solution that
          strengthens bonds and yields good results for all.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You overcome barriers both physical and spiritual, providing inspiration to
          your allies through your actions and—when your fellow adventurers ask for
          it—providing moral and ethical guidance.}

      - paste: book-ref
        params:
          page-ref: "_{PC p106}"

  - at: '@reference/actions'
    add:
      - paste: reference/action-refocus
      - paste: reference/action-sustain
      - action: reaction
        contents:
          - p:
            title: "_{Shield Block}"
            content: "_{While your shield is raised, reduce damage from a hit by its Hardness.}"

  - at: '@reference/action-traits'
    add:
      - flourish

  - at: '@reference/weapon-traits'
    add:
      - unarmed
      - nonlethal
      - agile
      - finesse
