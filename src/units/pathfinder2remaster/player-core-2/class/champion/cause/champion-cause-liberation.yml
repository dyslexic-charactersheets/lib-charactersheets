unit: remaster/champion/cause/liberation
in: remaster/champion/cause
group: "_{Player Core 2}"
name: "_{Liberation}"

inc:
  - set: subclass
    value: "_{Liberation}"
  - set: champion-cause
    value: "_{Liberation}"

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Liberation}"

  - at: '@champion/cause/tenets'
    replace:
      - ul:
        contents:
          - li: "_{Uphold the tenets of good: never commit an evil act, such as murder, torture, or casting an evil spell.}"
          - li: "_{Never knowingly harm an innocent, or allow harm to come to one when you could reasonably prevent it.}"
          - li: "_{Respect the choices others make over their own lives; you can't force someone to act in a particular way, even for their own good.}"
          - li: "_{Demand and fight for others' freedom to make their own decisions. Never engage in or countenance slavery, oppression, or tyranny.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Liberating Step}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Liberating Step}"
            content: "_{Free an ally from a restraining or damaging effect.}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Liberating Step}"
            content: "_{Free an ally from a restraining or damaging effect.}"

  - at: '@champion/reaction'
    replace:
      - section: "_{Champion's Reaction}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - h5: "_{Liberating Step}"
                  - p: "_{An enemy damages, grabs or grapples your ally within 15 feet of you. Your ally gains resistance, and can either attempt a new save against the triggering effect or Escape as a free action.}"
                  - calc:
                    output:
                      field: champion-liberation-liberating-step-resistance
                      legend: "_{Resistance}"
                      width: large
                      prefix: "+"
                      eq: "2+%{level}"
                    inputs:
                      - span: "2 +"
                      - field:
                        ref: level
                        label: "_{Level}"

              - level: 9
                contents:
                  - h5: "_{Divine Smite}"
                  - p: "_{If the foe had grabbed, restrained, immobilised or paralysed your ally, it takes persistent spirit damage (a holy effect):}"
                  - calc:
                    output:
                      field: champion-divine-smite-liberation
                      legend: "_{Damage}"
                      suffix: "_{pts}"
                      width: large
                      eq: "%{CHA}"
                    inputs:
                      - field:
                        ref: CHA
                        label: "_{CHA}"
                        underlay: "_{CHA}"

              - level: 11
                contents:
                  - h5: "_{Exalt}"
                  - p: "_{If your ally doesn't attempt to Escape or a new save, you and all allies within 15 feet can each Step as a reaction.}"
