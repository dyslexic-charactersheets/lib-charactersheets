unit: remaster/champion/cause/iniquity
in: remaster/champion/cause
group: "_{Player Core 2}"
name: "_{Iniquity}"

inc:
  - set: subclass
    value: "_{Iniquity}"
  - set: champion-cause
    value: "_{Iniquity}"

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Iniquity}"

  - at: '@champion/cause/tenets'
    replace:
      - ul:
        contents:
          - li: "_{Destroy that which offends you or stands in your way, take advantage of others, cheat, steal.}"
          - li: "_{Never bind yourself with a law other than what your deity requires.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Destructive Vengeance}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Destructive Vengeance}"
            content: "_{When an enemy damages you, drag it toward oblivion, dealing spirit damage in exchange for taking more yourself.}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Destructive Vengeance}"
            content: "_{When an enemy damages you, drag it toward oblivion, dealing spirit damage in exchange for taking more yourself.}"

  - at: '@champion/reaction'
    replace:
      - section: "_{Destructive Vengeance}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - g:
                    pad: true
                    contents:
                      - p: "_{An enemy in your champion's aura damages you. Bloodshed begets bloodshed as you drag your enemy toward oblivion. You increase the damage you take, and deal the same amount of spirit damage to the triggering enemy.}"
                      - table:
                        flip: true
                        rows:
                          - level: 1
                            damage: "_{1d6}"
                          - level: 5
                            damage: "_{2d6}"
                          - level: 9
                            damage: "_{3d6}"
                          - level: 12
                            damage: "_{4d6}"
                          - level: 16
                            damage: "_{5d6}"
                          - level: 19
                            damage: "_{6d6}"
                        columns:
                          - label: "_{Level}"
                            rotate: true
                          - label: "_{Spirit\nDamage}"
                            rotate: true
                        template:
                          - level-marker: "#{level}"
                            marker: ""
                          - value: "#{damage}"
                      - p: "_{In addition, until the end of your next turn, your Strikes against the triggering creature deal extra spirit damage.}"
                      - table:
                        flip: true
                        rows:
                          - level: 1
                            damage: "+2"
                          - level: 9
                            damage: "+4"
                          - level: 16
                            damage: "+6"
                        columns:
                          - label: "_{Level}"
                            rotate: true
                          - label: "_{Extra\nDamage}"
                            rotate: true
                        template:
                          - level-marker: "#{level}"
                            marker: ""
                          - value: "#{damage}"

              - level: 9
                contents:
                  - g:
                    pad: true
                    contents:
                      - layout: 2r
                        contents:
                          - p:
                            title: "_{Divine Smite}"
                            content: "_{An enemy damaged by the initial reaction's damage also takes persistent spirit damage (an unholy effect). This applies only to the damage the reaction itself deals, not the damage you deal with subsequent Strikes:}"
                          - calc:
                            output:
                              field: champion-divine-smite-iniquity
                              legend: "_{Damage}"
                              suffix: "_{pts}"
                              width: large
                              eq: "%{CHA}"
                            inputs:
                              - field:
                                ref: CHA
                                label: "_{CHA}"
                                underlay: "_{CHA}"

              - level: 11
                contents:
                  - g:
                    pad: true
                    contents:
                      - h5: "_{Exalt}"
                      - p: "_{Each enemy in your champion's aura other than the triggering creature takes half the damage you deal to the triggering enemy.}"
