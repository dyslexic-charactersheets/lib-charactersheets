unit: remaster/champion/cause/justice
in: remaster/champion/cause
group: "_{Player Core 2}"
name: "_{Justice}"

inc:
  - set: subclass
    value: "_{Justice}"
  - set: champion-cause
    value: "_{Justice}"

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Justice}"
        suffix: "_{Champion of}"

  - at: '@edicts'
    add:
      - li: "_{Follow the law.}"
      - li: "_{Respect legitimate authorities or leadership.}"

  - at: '@anathema'
    add:
      - li: "_{Take advantage of another, or cheat.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Retributive Strike}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Retributive Strike}"
            content: "_{When an ally is attacked, give them resistance and Strike their attacker.}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Retributive Strike}"
            content: "_{When an ally is attacked, give them resistance and Strike their attacker.}"

  - at: '@champion/reaction'
    replace:
      - section: "_{Retributive Strike}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - g:
                    pad: true
                    contents:
                      - p: "_{An enemy damages your ally within 15 feet of you. Your ally gains resistance to that damage, and if the enemy is within reach, you make a melee Strike against it.}"
                      - calc:
                        output:
                          field: champion-justice-retributive-strike-resistance
                          legend: "_{Resistance}"
                          width: huge
                          prefix: "+"
                          eq: "2+%{level}"
                        inputs:
                          - span: "2 +"
                          - field:
                            ref: level
                            label: "_{Level}"

              - level: 9
                contents:
                  - g:
                    pad: true
                    contents:
                      - h5: "_{Relentless Reaction}"
                      - p: "_{If your Strike hits, the target also takes persistent spirit damage (a holy effect):}"
                      - calc:
                        output:
                          field: champion-divine-smite-justice
                          legend: "_{Damage}"
                          suffix: "_{pts}"
                          width: huge
                          eq: "%{CHA}"
                        inputs:
                          - field:
                            ref: CHA
                            label: "_{CHA}"
                            underlay: "_{CHA}"

              - level: 11
                contents:
                  - g:
                    pad: true
                    contents:
                      - h5: "_{Exalted Reaction}"
                      - p: "_{Each ally in your champion's aura with the target in their melee reach can spend a reaction to Strike the target at a -5 penalty.}"
