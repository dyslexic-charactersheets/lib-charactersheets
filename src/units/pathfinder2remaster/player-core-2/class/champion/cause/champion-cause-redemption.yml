unit: remaster/champion/cause/redemption
in: remaster/champion/cause
group: "_{Player Core 2}"
name: "_{Redemption}"

inc:
  - set: subclass
    value: "_{Redemption}"
  - set: champion-cause
    value: "_{Redemption}"

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Redemption}"
        suffix: "_{Champion of}"
      
  - at: '@champion/cause/tenets'
    replace:
      - ul:
        contents:
          - li: "_{Uphold the tenets of good: never commit an evil act, such as murder, torture, or casting an evil spell.}"
          - li: "_{Never knowingly harm an innocent, or allow harm to come to one when you could reasonably prevent it.}"
          - li: "_{First try to redeem those who commit evil acts, rather than meting out punishment, so long as doing so doesn't endanger innocents.}"
          - li: "_{Show compassion for others, regardless of their authority or station, and never turn your back on someone seeking redemption.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Glimpse of Redemption}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Glimpse of Redemption}"
            content: "_{Force an enemy to reconsider harming your ally.}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Glimpse of Redemption}"
            content: "_{Force an enemy to reconsider harming your ally.}"

  - at: '@champion/reaction'
    replace:
      - section: "_{Glimpse of Redemption}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - p: "_{An enemy damages your ally within 15 feet of you. The enemy must choose one:}"
                  - ul:
                    contents:
                      - li: "_{Your ally takes no damage from the triggering effect.}"
                      - li: "_{Your ally gains resistance to the damage, and the foe is enfeebled 2 until the end of its next turn.}"
                  - calc:
                    output:
                      field: champion-redemption-glimpse-of-redemption-resistance
                      legend: "_{Resistance}"
                      width: large
                      prefix: "+"
                      eq: "2+%{level}"
                    inputs:
                      - span: "2 +"
                      - field:
                        ref: level
                        label: "_{Level}"

              - level: 9
                contents:
                  - layout: 2r
                    contents:
                      - p:
                        title: "_{Divine Smite}"
                        content: "_{If the foe chooses to deal damage anyway, it takes persistent spirit damage (a holy effect):}"
                      - calc:
                        output:
                          field: champion-divine-smite-redemption
                          legend: "_{Damage}"
                          suffix: "_{pts}"
                          width: large
                          eq: "%{CHA}"
                        inputs:
                          - field:
                            ref: CHA
                            label: "_{CHA}"
                            underlay: "_{CHA}"

              - level: 11
                contents:
                  - h5: "_{Exalt}"
                  - p: "_{Apply Glimpse of Redemption to yourself and all allies within 15 feet at once, though the bonus to resistance is 2 lower for each.}"
