unit: remaster/champion/cause/redemption
in: remaster/champion/cause
group: "_{Player Core 2}"
name: "_{Redemption}"

inc:
  - set: subclass
    value: "_{Redemption}"
  - set: champion-cause
    value: "_{Redemption}"
  - set: champion-holy
    value: true

  - at: '@champion/class-name'
    replace:
      - class-name: "_{Redemption}"
        suffix: "_{Champion of}"

  - at: '@edicts'
    add:
      - li: "_{Try to redeem those who commit wicked deeds.}"
      - li: "_{Show compassion to others, regardless of their authority or station.}"

  - at: '@anathema'
    add:
      - li: "_{Kill a sapient enemy without first offering a chance at redemption.}"

  - at: '@advancement'
    add:
      - level: 1
        advance: "_{Glimpse of Redemption}"

  - at: '@actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Glimpse of Redemption}"
            content: "_{Force an enemy to reconsider harming your ally.}"

  - at: '@reference/actions'
    add:
      - action: reaction
        contents:
          - p:
            title: "_{Glimpse of Redemption}"
            content: "_{Force an enemy to reconsider harming your ally.}"

  - at: '@champion/reaction'
    replace:
      - section: "_{Glimpse of Redemption}"
        contents:
          - list:
            hr: true
            contents:
              - action: reaction
                contents:
                  - p: "_{An enemy damages your ally within 15 feet of you. The enemy must choose one:}"
                  - ul:
                    contents:
                      - li: "_{Your ally takes no damage from the triggering effect.}"
                      - li: "_{Your ally gains resistance to the damage, and the foe is enfeebled 2 until the end of its next turn.}"
                  - calc:
                    output:
                      field: champion-redemption-glimpse-of-redemption-resistance
                      legend: "_{Resistance}"
                      width: large
                      prefix: "+"
                      eq: "2+%{level}"
                    inputs:
                      - span: "2 +"
                      - field:
                        ref: level
                        label: "_{Level}"

              - level: 9
                contents:
                  - h5: "_{Relentless Reaction}"
                  - p: "_{If the foe chooses to deal damage anyway, it takes persistent spirit damage (a holy effect):}"
                  - calc:
                    output:
                      field: champion-divine-smite-redemption
                      legend: "_{Damage}"
                      suffix: "_{pts}"
                      width: large
                      eq: "%{CHA}"
                    inputs:
                      - field:
                        ref: CHA
                        label: "_{CHA}"
                        underlay: "_{CHA}"

              - level: 11
                contents:
                  - h5: "_{Exalted Reaction}"
                  - p: "_{If the enemy refuses, you can choose to grant the resistance to yourself and all allies in your champion's aura, including the triggering ally. If you do, the resistance is reduced by 2 for all.}"
