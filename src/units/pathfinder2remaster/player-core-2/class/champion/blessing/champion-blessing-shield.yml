unit: remaster/champion/blessing/shield
in: remaster/champion/blessing
group: "_{Player Core 2}"
name: "_{Blessed Shield}"

inc:
  - set: champion-blessing
    value: "_{Blessed Shield}"

  - at: '@champion/blessing-section'
    replace:
      - section: "_{Blessed Shield}"
        flex: small
        contents:
          - level: 3
            contents:
              - list:
                hr: true
                light: true
                contents:
                  - p: "_{Your shield gains a reinforcing rune. If your shield supercedes the rune's powers for your level, then the shield's Hardness instead increases by 1.}"
                  - table:
                    flip: true
                    rows:
                      - level: 3
                        rune: "_{Minor}"
                        hardness: "+3"
                        hp: "+44"
                      - level: 7
                        rune: "_{Lesser}"
                        hardness: "+3"
                        hp: "+52"
                      - level: 10
                        rune: "_{Moderate}"
                        hardness: "+3"
                        hp: "+64"
                      - level: 13
                        rune: "_{Greater}"
                        hardness: "+5"
                        hp: "+80"
                      - level: 16
                        rune: "_{Major}"
                        hardness: "+5"
                        hp: "+84"
                      - level: 19
                        rune: "_{Supreme}"
                        hardness: "+7"
                        hp: "+108"
                    columns:
                      - label: "_{Rune /\nLevel}"
                      - label: "_{Hardness}"
                      - label: "_{HP}"
                    template:
                      - level-marker: "#{level}"
                        marker: "#{rune}"
                      - value: "#{hardness}"
                      - value: "#{hp}"
                  - field: champion-blessed-shield-rune
                    label: "_{Current Rune}"
                    width: stretch
                    frame: annotation
