unit: remaster/champion/blessing/shield
in: remaster/champion/blessing
group: "_{Player Core 2}"
name: "_{Blessed Shield}"

inc:
  - set: champion-blessing
    value: "_{Blessed Shield}"

  - at: '@champion/blessing'
    replace:
      - h5: "_{Blessed Shield}"
      - p: "_{In your hands, a shield gains the minor reinforcing rune. As you go up in level, the shield gains the reinforcing rune of your level: lesser at 7th level, moderate at 10th level, greater at 13th level, major at 16th level, and supreme at 19th level. If your shield already has the appropriate reinforcing rune for your level, or if it's a sturdy shield of the same level as the appropriate reinforcing rune, the shield's Hardness instead increases by 1.}"
      - field: champion-blessed-shield-rune
        label: "_{Current Reinforcing Rune}"
        width: stretch
        frame: none
