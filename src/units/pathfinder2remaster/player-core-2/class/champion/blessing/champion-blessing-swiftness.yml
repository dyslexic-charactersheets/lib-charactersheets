unit: remaster/champion/blessing/swiftness
in: remaster/champion/blessing
group: "_{Player Core 2}"
name: "_{Blessed Swiftness}"

inc:
  - set: champion-blessing
    value: "_{Blessed Swiftness}"

  - at: '@champion/blessing'
    replace:
      - h5: "_{Blessed Swiftness}"
      - p: "_{You gain a +5-foot status bonus to Speed. If you're mounted, your mount gains the bonus instead. In addition, when the movement of one of your allies triggers an enemy's reaction while the ally is in your champion's aura, the ally gains a +2 status bonus to all defences against that reaction.}"
      - field: champion-blessed-swiftness-speed
        control: value
        label: "_{Speed Bonus}"
        value: "+5 ft"
        width: large
