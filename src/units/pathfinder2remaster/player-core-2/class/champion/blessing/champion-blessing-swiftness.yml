unit: remaster/champion/blessing/swiftness
in: remaster/champion/blessing
group: "_{Player Core 2}"
name: "_{Blessed Swiftness}"

inc:
  - set: champion-blessing
    value: "_{Blessed Swiftness}"

  - at: '@champion/blessing-section'
    replace:
      - section: "_{Blessed Swiftness}"
        flex: small
        contents:
          - level: 3
            contents:
              - list:
                hr: true
                light: true
                contents:
                  - p: "_{You or your mount gains a +5-foot status bonus to Speed. An ally in your champion's auta triggering an enemy's reaction gains a +2 status bonus to all defences against it.}"
                  - field: champion-blessed-swiftness-speed
                    control: value
                    label: "_{Speed Bonus}"
                    value: "+5 ft"
                    width: large
