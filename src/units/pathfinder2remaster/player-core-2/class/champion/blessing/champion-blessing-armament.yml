unit: remaster/champion/blessing/armament
in: remaster/champion/blessing
group: "_{Player Core 2}"
name: "_{Blessed Armament}"

inc:
  - set: champion-blessing
    value: "_{Blessed Armament}"

  - at: '@champion/blessing'
    replace:
      - h5: "_{Blessed Armament}"
      - p: "_{Select one weapon or handwraps of mighty blows. You gain that armament's critical specialisation effect, and you grant it a property rune of your choice from the list below. During your daily preparations, you can change the spirit to inhabit a different armament, grant a different rune, or both.}"
      - field: champion-blessed-armament-weapon
        label: "_{Weapon or Handwraps}"
        width: stretch
      - list:
        hr: true
        light: true
        contents:
          - g:
            contents:
              - selectable: "##:blessed-armament/fearsome"
                contents:
                  - p:
                    title: "_{Fearsome}"
                    content: "_{On a critical hit, the target becomes frightened 1, or frightened 2 if it's already frightened.}"
          - g:
            contents:
              - selectable: "##:blessed-armament/ghost-touch"
                contents:
                  - p:
                    title: "_{Ghost Touch}"
                    content: "_{Can harm incorporeal creatures without a penalty.}"
          - g:
            contents:
              - selectable: "##:blessed-armament/returning"
                contents:
                  - p:
                    title: "_{Returning}"
                    content: "_{When thrown, flies back to your hand after the attack.}"
          - g:
            contents:
              - action:
                contents:
                  - selectable: "##:blessed-armament/shifting"
                    contents:
                      - p:
                        title: "_{Shifting}"
                        content: "_{As an action, reshape it into a different melee weapon you're familiar with.}"
          - g:
            contents:
              - selectable: "##:blessed-armament/vitalizing"
                contents:
                  - p:
                    title: "_{Vitalizing}"
                    content: "_{On a critical hit, you or an ally within 10 feet regains Hit Points equal to twice the weapon's number of damage dice.}"
