# curse tiers -> Cursebound condition
# mysteries grant a fixed skill, domain list, 1st-level oracle feat, and granted-spell list
# New: Divine Access

unit: class/remaster/oracle/reference
name: "_{Oracle Reference}"
group: "_{Player Core 2}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Oracle}"
      - p: >
          _{Your conduit to divine power eschews the traditional channels of prayer and
          servitude—you instead glean sacred truths and great mysteries embodied in
          overarching concepts, whether because you perceive the common ground across
          multiple deities or circumvent their power entirely. You explore one of these
          mysteries and draw upon its power to cast miraculous spells, but that power comes
          with a terrible price: a curse that grows stronger the more you draw upon it, which
          you might uphold as an instrument of the divine or view as punishment from the gods.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You draw upon your mystery to empower yourself in combat, balancing miraculous
          effects with the increasing severity of your curse as conflicting divine demands
          overtax your physical body. You cast spells to aid your allies and devastate your
          foes, or depending on your mystery, you might wade into battle yourself.}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{You rely upon the insights drawn from your mystery. You might leverage your curse
          to intimidate people or hide its effects to better blend in.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You recenter yourself to bring the terrible metaphysical conflicts causing your curse
          back under control so you can draw upon your mystery's power again later. You remain
          aware of supernatural forces acting around you, perhaps peeking into the future to
          gain insights.}

      - paste: book-ref
        params:
          page-ref: "_{PC2 p128}"

  - at: '@reference/actions'
    add:
      - paste: reference/action-refocus

  - at: '@reference/action-traits'
    add:
      - concentrate
      - cursebound
      - fortune
      - manipulate
