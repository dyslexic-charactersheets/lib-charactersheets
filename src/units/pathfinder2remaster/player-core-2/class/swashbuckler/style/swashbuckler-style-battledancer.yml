unit: remaster/swashbuckler/style/battledancer
in: remaster/swashbuckler/style
group: "_{Player Core 2}"
name: "_{Battledancer}"

inc:
  - set: subclass
    value: "_{Battledancer}"

  - set: swashbuckler-style
    value: "_{Battledancer}"
  - set: performance-proficiency
    value: trained

  - at: '@swashbuckler/gain-panache'
    replace:
      - li:
        contents:
          - p: "_{You Perform}"

  - at: '@swashbuckler/style'
    replace:
      - h4: "_{Battledancer}"
      - hr:
        swash: true
      - layout: 2e
        contents:
          - g:
            contents:
              - h5: "_{Fascinating Performance}"
              - p: "_{Attempt a Performance check against an audience's Will DC to fascinate them.}"
          - g:
            contents:
              - level: 9
                contents:
                  - h5: "_{Exemplary Finisher}"
                  - p: "_{When you successfully strike as part of a finisher...}"
                  - action: free
                    contents:
                      - p: "_{Step as a free action immediately after a successful finisher.}"
              - spacer:
