unit: remaster/swashbuckler/style/braggart
in: remaster/swashbuckler/style
group: "_{Player Core 2}"
name: "_{Braggart}"

inc:
  - set: subclass
    value: "_{Braggart}"

  - set: swashbuckler-style
    value: "_{Braggart}"
  - set: intimidation-proficiency
    value: trained

  - at: '@swashbuckler/gain-panache'
    replace:
      - li:
        contents:
          - p: "_{You Demoralise a foe}"

  - at: '@swashbuckler/style'
    replace:
      - h4: "_{Braggart}"
      - hr:
        swash: true
      - level: 9
        contents:
          - h5: "_{Exemplary Finisher}"
          - p: "_{When you successfully strike as part of a finisher...}"
          - p: "_{If the foe was temporarily immune to your Demoralise, their temporary immunity ends.}"
