unit: remaster/swashbuckler/style/wit
in: remaster/swashbuckler/style
group: "_{Player Core 2}"
name: "_{Wit}"

inc:
  - set: subclass
    value: "_{Wit}"

  - set: swashbuckler-style
    value: "_{Wit}"
  - set: diplomacy-proficiency
    value: trained

  - at: '@swashbuckler/gain-panache'
    replace:
      - li:
        contents:
          - p: "_{You use Bon Mot}"

  - at: '@swashbuckler/style'
    replace:
      - h4: "_{Wit}"
      - hr:
        swash: true
      - layout: 2e
        contents:
          - g:
            contents:
              - h5: "_{Bon Mot}"
              - p: "_{Choose a foe within 30ft and roll a Diplomacy check against their Will DC.}"
              - paste: save
                params:
                  critical_success: "_{Target takes a -3 status penalty to Perception and Will saves for 1 minute. Target can end the effect early with a retort.}"
                  success: "_{As critical success, but the penalty is -2.}"
                  critical_failure: "_{You take the same penalty as on a success, until 1 minute passes or you Bon Mot again successfully.}"
          - g:
            contents:
              - level: 9
                contents:
                  - h5: "_{Exemplary Finisher}"
                  - p: "_{When you successfully strike as part of a finisher...}"
                  - value-block: "-2"
                    content: "_{Foe's attack penalty against you until your next turn.}"
              - spacer:
