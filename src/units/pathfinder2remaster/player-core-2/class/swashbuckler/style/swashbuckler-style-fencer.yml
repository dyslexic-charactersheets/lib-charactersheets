unit: remaster/swashbuckler/style/fencer
in: remaster/swashbuckler/style
group: "_{Player Core 2}"
name: "_{Fencer}"

inc:
  - set: subclass
    value: "_{Fencer}"

  - set: swashbuckler-style
    value: "_{Fencer}"
  - set: deception-proficiency
    value: trained

  - at: '@swashbuckler/gain-panache'
    replace:
      - li:
        contents:
          - p: "_{You Create a Distraction or Feint}"

  - at: '@swashbuckler/style'
    replace:
      - h4: "_{Fencer}"
      - hr:
        swash: true
      - level: 9
        contents:
          - h5: "_{Exemplary Finisher}"
          - p: "_{When you successfully strike as part of a finisher...}"
          - p: "_{The foe is off-guard until your next turn.}"
