# - Precise Strike applies even when SB doesn't have Panache
# - Stylish Combatant grants bonus to any Bravado-trait skill check in combat
# - Continuous Flair here extends Stylish Combatant's bonus into exploration
# - finishing move -> finisher 
# - formal Bravado trait introduced

unit: class/remaster/swashbuckler/reference
name: "_{Swashbuckler Reference}"
group: "_{Player Core 2}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Swashbuckler}"
      - p: >
          _{Many warriors rely on brute force, weighty armor, or cumbersome weapons.
          For you, battle is a dance where you move among foes with style and grace.
          You dart among combatants with flair and land powerful finishing moves
          with a flick of the wrist and a flash of the blade, all while countering
          attacks with elegant ripostes that keep enemies off balance. Harassing and
          thwarting your foes lets you charm fate and cheat death time and again with
          aplomb and plenty of flair.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You show off to gain panache, leveraging your flair to build up to
          powerful finishing moves. You stay nimble, moving into the best position
          to perform your maneuvers while dodging enemy blows and responding with
          swift ripostes. Depending on your swashbuckler's style, you might dance
          among your foes; slip past their defenses; or beguile, distract, or
          frighten them.}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{You are equally likely to charm or intimidate others—or both. You might
          be an adept socialite, or you might create distractions for others who do
          the talking.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You keep a careful eye on your surroundings and other people, always
          prepared to leap into action with bravado and flair. You interact with the
          environment in bold, sweeping strokes rather than skulking to avoid
          detection.}

      - paste: book-ref
        params:
          page-ref: "_{PC2 p158}"

  - at: '@reference/actions'
    add:
      - action:
        contents:
          - p:
            title: "_{Confident Finisher}"
            content: "_{Make a Strike with panache; deal half your precise strike damage on a failure.}"
      - action: reaction
        contents:
          - p:
            title: "_{Opportune Riposte}"
            content: "_{An adjacent foe critically fails a Strike against you. Strike it, or Disarm it.}"

  - at: '@reference/action-traits'
    add:
      - bravado
      - finisher
      - flourish

  - at: '@reference/weapon-traits'
    add:
      - deadly
      - thrown
