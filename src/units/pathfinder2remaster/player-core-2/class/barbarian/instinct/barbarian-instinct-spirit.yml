unit: remaster/barbarian/instinct/spirit
in: remaster/barbarian/instinct
group: "_{Player Core 2}"
name: "_{Spirit}"

inc:
  - set: barbarian-instinct
    value: "_{Spirit}"

  - at: '@barbarian/instinct'
    replace:
      - g:
        contents:
          - h4: "_{Spirit}"
          - hr:
            swash: true

  - at: '@barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@barbarian/left'
    add:
      - section: "[b]_{Spirit Rage!}[/b]"
        id: spirit-rage
        contents:
          - list:
            hr: true
            contents:
              - g:
                contents:
                  - p: "_{[b]Rage![/b] to choose to make your [b]Rage![/b] attack spirit and its bonus +3 damage. Add the ghost touch rune effect and <span class='flag'>Divine</span> to it.}"
                  - indent: left
                    contents:
                      - field: barbarian-spirit-rage-damage-bonus
                        label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                        frame: right
                        control: value
                        width: large
                        value: "+3"

  - at: '@barbarian/specialisation-ability'
    replace:
      - level: 7
        contents:
          - h5: "_{Instinct Specialisation}"
          - field: barbarian-spirit-rage-damage-bonus-spec
            label: "_{[b]Spirit Rage![/b] Damage Bonus}"
            frame: right
            control: value
            width: large
            value: "+7"

  - at: '@barbarian/specialisation-ability/greater'
    replace:
      - level: 15
        contents:
          - h5: "_{Greater Instinct Specialisation}"
          - field: barbarian-spirit-rage-bonus-greater
            label: "_{[b]Spirit Rage![/b] Damage Bonus}"
            frame: right
            control: value
            width: large
            value: "+13"

  - at: '@barbarian/raging-resistance'
    replace:
      - layout: 2e
        contents:
          - field: barbarian-raging-resistance-void
            label: "_{Void damage}"
            width: stretch
            control: checkbox
            value: true
            frame: right
          - field: barbarian-raging-resistance-undead
            label: "_{Undead damage}"
            width: stretch
            control: checkbox
            value: true
            frame: right