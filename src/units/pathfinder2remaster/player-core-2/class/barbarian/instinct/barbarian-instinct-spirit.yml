unit: remaster/barbarian/instinct/spirit
in: remaster/barbarian/instinct
group: "_{Player Core 2}"
name: "_{Spirit}"

inc:
  - set: barbarian-instinct
    value: "_{Spirit}"

  - at: '@barbarian/instinct'
    replace:
      - g:
        contents:
          - h4: "_{Spirit}"
          - hr:
            swash: true

  - at: '@barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@barbarian/left'
    add:
      - section: "[b]_{Spirit Rage!}[/b]"
        id: spirit-rage
        contents:
          - list:
            hr: true
            contents:
              - g:
                contents:
                  - p: "_{Each time you [b]Rage![/b], you can choose to make your [b]Rage![/b] bonus +3 spirit damage. Your weapon or unarmed attack then gains the ghost touch rune effect, [b]Rage![/b] action becomes <span class='flag'>Divine</span> and deals spirit damage."
                  - indent: left
                    contents:
                      - field: barbarian-spirit-rage-damage-bonus
                        label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                        frame: right
                        control: value
                        width: large
                        value: "+3"
              - level: 7
                contents:
                  - h5: "_{Instinct Specialisation}"
                  - field: barbarian-spirit-rage-damage-bonus-spec
                    label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                    frame: right
                    control: value
                    width: large
                    value: "+7"
              - level: 15
                contents:
                  - h5: "_{Greater Instinct Specialisation}"
                  - field: barbarian-spirit-rage-bonus-greater
                    label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                    frame: right
                    control: value
                    width: large
                    value: "+13"

  - at: '@barbarian/specialisation-ability'
    replace:
      - nothing:

  - at: '@barbarian/specialisation-ability/greater'
    replace:
      - nothing:

  - at: '@barbarian/raging-resistance'
    replace:
      - layout: 2e
        contents:
          - field: barbarian-raging-resistance-void
            label: "_{Void damage}"
            width: stretch
            control: checkbox
            value: true
            frame: right
          - field: barbarian-raging-resistance-undead
            label: "_{Undead damage}"
            width: stretch
            control: checkbox
            value: true
            frame: right