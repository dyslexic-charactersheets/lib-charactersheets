unit: remaster/sorcerer/bloodline/imperial
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Imperial}"

inc:
  - set: subclass
    value: "_{Imperial}"
  - set: sorcerer-bloodline
    value: "_{Imperial}"

  - set: arcana-proficiency
    value: trained
  - set: society-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Imperial}"

  - set: sorcerer-bloodline-tradition
    value: "_{Arcane}"
  - set: sorcerer-bloodline-skills
    value: "_{Arcana, Society}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Ancestral Memories}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Extend Blood Magic}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Arcane Countermeasure}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Detect Magic}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Force Barrage}"
      - "_{Dispel Magic}"
      - "_{Haste}"
      - "_{Translocate}"
      - "_{Scouting Eye}"
      - "_{Disintegrate}"
      - "_{Retrocognition}"
      - "_{Quandary}"
      - "_{Implosion}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Ancestral Memories}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Gain +1 status to your next spell attack roll this turn, or an enemy within 60ft takes -1 status to its next save against a spell you cast this turn.}"
              - p: "_{Heightened (5th): the bonus increases to +2 or the penalty increases to -2.}"
              - p: "_{Heightened (8th): the bonus increases to +3 or the penalty increases to -3.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Extend Blood Magic}"
            cat: "_{Focus 3}"
            contents:
              - p: "_{If your next action Casts a Spell granting a blood magic effect lasting at least 1 round, that effect lasts 1 round longer. Only one extended effect at a time.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: reaction
        contents:
          - article:
            title: "_{Arcane Countermeasure}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  trigger: "_{A creature within range that you can see Casts a Spell.}"
                  range: "_{120ft}"
                  target: "_{the spell cast by the triggering creature}"
              - p: "_{Reduce the target spell's rank by 1 (not below its minimum) and give its targets +2 status to saves/skill checks/AC/DC against it; the +2 applies even if the rank can't be reduced.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Imperious Defense}"
        contents:
          - p: "_{Until the start of your next turn, gain +1 status to AC or saving throws.}"
