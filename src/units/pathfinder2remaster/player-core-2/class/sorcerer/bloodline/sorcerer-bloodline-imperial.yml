unit: remaster/sorcerer/bloodline/imperial
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Imperial}"

inc:
  - set: subclass
    value: "_{Imperial}"
  - set: sorcerer-bloodline
    value: "_{Imperial}"

  - set: arcana-proficiency
    value: trained
  - set: society-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Imperial}"

  - set: sorcerer-bloodline-tradition
    value: "_{Arcane}"
  - set: sorcerer-bloodline-skills
    value: "_{Arcana, Society}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Ancestral Memories}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Extend Blood Magic}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Arcane Countermeasure}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Detect Magic}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Force Barrage}"
      - "_{Dispel Magic}"
      - "_{Haste}"
      - "_{Translocate}"
      - "_{Scouting Eye}"
      - "_{Disintegrate}"
      - "_{Retrocognition}"
      - "_{Quandary}"
      - "_{Implosion}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Ancestral Memories}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{The memories of long-dead spellcasters grant you their knowledge, making your spells more formidable. You gain either a +1 status bonus to the next spell attack roll you attempt before the end of your turn or an enemy within 60 feet takes a -1 status penalty to the next saving throw they attempt against a spell you cast before the end of your turn.}"
              - p: "_{Heightened (5th): the bonus increases to +2 or the penalty increases to -2.}"
              - p: "_{Heightened (8th): the bonus increases to +3 or the penalty increases to -3.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Extend Blood Magic}"
            cat: "_{Focus 3}"
            contents:
              - p: "_{You call upon the arcane energy coursing through your blood to extend the magic it grants. If your next action is to Cast a Spell that grants you a blood magic effect that lasts for at least 1 round, you or a target gain the blood magic effect for an additional round. You can have only one extended blood magic effect at a time.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: reaction
        contents:
          - article:
            title: "_{Arcane Countermeasure}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  trigger: "_{A creature within range that you can see Casts a Spell.}"
                  range: "_{120ft}"
                  target: "_{the spell cast by the triggering creature}"
              - p: "_{You undermine the target spell, making it easier to defend against. You reduce the spell's rank by 1, and targets of the spell gain a +2 status bonus to any saving throws, skill checks, AC, or DC against it. You can't reduce the spell's rank below its minimum (for example, a 5th-rank howling blizzard would remain 5th-rank, but a 5th-rank fireball would become 4th-rank). Targets still gain all the other benefits, even if you don't reduce the spell's rank.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Imperious Defense}"
        contents:
          - p: "_{Raw magic emanates from every cell in your body, protecting you. Until the start of your next turn, gain a +1 status bonus to AC or to saving throws.}"
