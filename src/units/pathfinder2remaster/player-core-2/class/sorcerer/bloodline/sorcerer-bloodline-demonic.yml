unit: remaster/sorcerer/bloodline/demonic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Demonic}"

inc:
  - set: subclass
    value: "_{Demonic}"
  - set: sorcerer-bloodline
    value: "_{Demonic}"

  - set: intimidation-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Demonic}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Religion}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: caustic blast. 1st: fear. 2nd: enlarge. 3rd: slow. 4th: divine wrath. 5th: blister. 6th: disintegrate. 7th: divine decree. 8th: canticle of everlasting grief. 9th: implosion.}"

  - set: sorcerer-bloodline-spell-initial
    value: "_{Glutton's Jaws}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Swamp of Sloth}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Chthonian Wrath}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Caustic Blast}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Fear}"
      - "_{Enlarge}"
      - "_{Slow}"
      - "_{Divine Wrath}"
      - "_{Blister}"
      - "_{Disintegrate}"
      - "_{Divine Decree}"
      - "_{Canticle of Everlasting Grief}"
      - "_{Implosion}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Glutton's Jaws}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Sprout a set of ravenous jaws, biting a foe and gaining temporary Hit Points from the feast.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Swamp of Sloth}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Conjure a mire of corruption that slows and sickens creatures within it.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Chthonian Wrath}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{Call up a burst of demonic wrath from below, dealing damage and dragging foes downward.}"

  - set: sorcerer-blood-magic-initial
    value: "_{Corruption of Sin—You mentally broadcast brief glimpses into the darkest desires of the mind. Either a target takes a -1 status penalty to AC for 1 round, or you gain a +2 status bonus to Intimidation checks for 1 round.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Blood Magic—Corruption of Sin}"
        contents:
          - p: "_{You mentally broadcast brief glimpses into the darkest desires of the mind. Either a target takes a -1 status penalty to AC for 1 round, or you gain a +2 status bonus to Intimidation checks for 1 round.}"
