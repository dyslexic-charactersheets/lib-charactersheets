unit: remaster/sorcerer/bloodline/demonic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Demonic}"

inc:
  - set: subclass
    value: "_{Demonic}"
  - set: sorcerer-bloodline
    value: "_{Demonic}"

  - set: intimidation-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Demonic}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Religion}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Glutton's Jaws}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Swamp of Sloth}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Chthonian Wrath}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Caustic Blast}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Fear}"
      - "_{Enlarge}"
      - "_{Slow}"
      - "_{Divine Wrath}"
      - "_{Blister}"
      - "_{Disintegrate}"
      - "_{Divine Decree}"
      - "_{Canticle of Everlasting Grief}"
      - "_{Implosion}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Glutton's Jaws}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 creature}"
                  save: "_{AC}"
              - p: "_{A maw opens beneath the target. Spell attack roll; on a hit, deals piercing damage and grants you temp HP until your next turn begins.}"
              - calc:
                output:
                  field: "##:gluttons-jaws/damage"
                  legend: "_{Piercing\nDamage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "%{focus-rank}*2"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - calc:
                output:
                  field: "##:gluttons-jaws/temp-hp"
                  legend: "_{Temporary\nHit Points}"
                  width: large
                  suffix: "_{d4}"
                  icon: d4
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action: "13"
        contents:
          - article:
            title: "_{Swamp of Sloth}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  range: "_{120ft}"
                  area: "_{5-foot burst or more}"
                  save: "_{basic Fortitude}"
                  duration: "_{1 minute}"
              - p: "_{Ground becomes fetid difficult terrain; demonic sludge beasts swarm and stench creatures inside. Poison damage to creatures ending their turn in the area. Each extra action spent casting adds 5ft to the radius.}"
              - calc:
                output:
                  field: "##:swamp-of-sloth/damage"
                  legend: "_{Poison\nDamage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "floor((%{focus-rank}-3)/2)+1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Chthonian Wrath}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  area: "_{60-foot cone}"
                  save: "_{basic Reflex}"
              - p: "_{Evoke energy from the Outer Rifts. Roll on the table for one energy and one physical damage type, dealing both to each creature in the cone.}"
              - calc:
                output:
                  field: "##:chthonian-wrath/damage"
                  legend: "_{Damage\n(of Each Type)}"
                  width: large
                  suffix: "_{d6 each}"
                  icon: d6
                  eq: "%{focus-rank}-1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Corruption of Sin}"
        contents:
          - p: "_{A target takes -1 status to AC for 1 round, or you gain +2 status to Intimidation checks for 1 round.}"
