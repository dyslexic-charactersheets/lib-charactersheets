unit: remaster/sorcerer/bloodline/aberrant
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Aberrant}"

inc:
  - set: subclass
    value: "_{Aberrant}"
  - set: sorcerer-bloodline
    value: "_{Aberrant}"

  - set: intimidation-proficiency
    value: trained
  - set: occultism-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Aberrant}"

  - set: sorcerer-bloodline-tradition
    value: "_{Occult}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Occultism}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: daze. 1st: phantom pain. 2nd: stupefy. 3rd: vampiric feast. 4th: confusion. 5th: slither. 6th: never mind. 7th: warp mind. 8th: uncontrollable dance. 9th: unfathomable song.}"

  - set: sorcerer-bloodline-spell-initial
    value: "_{Tentacular Limbs}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Aberrant Whispers}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Unusual Anatomy}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Daze}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Phantom Pain}"
      - "_{Stupefy}"
      - "_{Vampiric Feast}"
      - "_{Confusion}"
      - "_{Slither}"
      - "_{Never Mind}"
      - "_{Warp Mind}"
      - "_{Uncontrollable Dance}"
      - "_{Unfathomable Song}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Tentacular Limbs}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Grow writhing tentacles that can deliver touch spells or make unarmed strikes.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Aberrant Whispers}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Utter phrases in an unknown tongue, dealing mental damage to creatures near you.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Unusual Anatomy}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{Transform your flesh into bizarre shapes, gaining resistances and other strange benefits.}"

  - set: sorcerer-blood-magic-initial
    value: "_{Eerie Veil—An ominous pall spills from your mind. Either one target takes a -1 status penalty to Will saving throws for 1 round or you gain a +2 status bonus to Will saving throws for 1 round.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Blood Magic—Eerie Veil}"
        contents:
          - p: "_{An ominous pall spills from your mind. Either one target takes a -1 status penalty to Will saving throws for 1 round or you gain a +2 status bonus to Will saving throws for 1 round.}"
