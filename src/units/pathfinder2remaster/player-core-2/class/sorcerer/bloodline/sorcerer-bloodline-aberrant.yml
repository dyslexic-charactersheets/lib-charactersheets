unit: remaster/sorcerer/bloodline/aberrant
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Aberrant}"

inc:
  - set: subclass
    value: "_{Aberrant}"
  - set: sorcerer-bloodline
    value: "_{Aberrant}"

  - set: intimidation-proficiency
    value: trained
  - set: occultism-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Aberrant}"

  - set: sorcerer-bloodline-tradition
    value: "_{Occult}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Occultism}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Tentacular Limbs}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Aberrant Whispers}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Unusual Anatomy}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Daze}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Phantom Pain}"
      - "_{Stupefy}"
      - "_{Vampiric Feast}"
      - "_{Confusion}"
      - "_{Slither}"
      - "_{Never Mind}"
      - "_{Warp Mind}"
      - "_{Uncontrollable Dance}"
      - "_{Unfathomable Song}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Tentacular Limbs}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Your arms become tentacles: reach 10ft for touch spells and unarmed Strikes. When casting, spend an action to extend reach to 20ft for that spell.}"
              - p: "_{Heightened (+2): the extended reach increases by 10ft.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action: "13"
        contents:
          - article:
            title: "_{Aberrant Whispers}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  area: "_{5-foot emanation or more}"
                  target: "_{each foe in the area}"
                  save: "_{Will}"
                  duration: "_{1 round}"
              - p: "_{Assault nearby minds; each target is then immune for 1 minute regardless of its save. Each extra action spent casting adds 5ft to the radius.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Unaffected.}"
                  failure: "_{Stupefied 2.}"
                  critical_failure: "_{Confused.}"
              - p: "_{Heightened (+3): the initial radius increases by 5 feet.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Unusual Anatomy}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Your flesh becomes a bizarre amalgam of skin, scales, hair, and growths.}"
              - ul:
                contents:
                  - li: "_{You gain darkvision.}"
                  - li: "_{Acid oozes from your skin; unarmed or non-reach melee attackers take acid damage.}"
              - calc:
                output:
                  field: "##:unusual-anatomy/resistance"
                  legend: "_{Precision /\nCritical Hit\nResistance}"
                  width: large
                  eq: "floor((%{focus-rank}-5)/2)*5+10"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - calc:
                output:
                  field: "##:unusual-anatomy/damage"
                  legend: "_{Acid\nDamage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "floor((%{focus-rank}-5)/2)+2"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - p: "_{If resistance exceeds a critical hit's extra damage, that extra is reduced to 0 (normal damage unaffected).}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Eerie Veil}"
        contents:
          - p: "_{One target takes -1 status to Will saves for 1 round, or you gain +2 status to Will saves for 1 round.}"
