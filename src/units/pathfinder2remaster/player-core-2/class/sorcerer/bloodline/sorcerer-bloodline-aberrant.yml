unit: remaster/sorcerer/bloodline/aberrant
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Aberrant}"

inc:
  - set: subclass
    value: "_{Aberrant}"
  - set: sorcerer-bloodline
    value: "_{Aberrant}"

  - set: intimidation-proficiency
    value: trained
  - set: occultism-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Aberrant}"

  - set: sorcerer-bloodline-tradition
    value: "_{Occult}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Occultism}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Tentacular Limbs}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Aberrant Whispers}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Unusual Anatomy}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Daze}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Phantom Pain}"
      - "_{Stupefy}"
      - "_{Vampiric Feast}"
      - "_{Confusion}"
      - "_{Slither}"
      - "_{Never Mind}"
      - "_{Warp Mind}"
      - "_{Uncontrollable Dance}"
      - "_{Unfathomable Song}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Tentacular Limbs}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Your arms turn into long, pliable tentacles, increasing your reach when delivering touch spells and making unarmed Strikes with your arms to 10 feet. During the duration, whenever you Cast a Spell, you can add an action to extend your reach to 20 feet to deliver that spell.}"
              - p: "_{Heightened (+2): when you add an action to extend your reach, it increases by an additional 10 feet.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action: "13"
        contents:
          - article:
            title: "_{Aberrant Whispers}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  area: "_{5-foot emanation or more}"
                  target: "_{each foe in the area}"
                  save: "_{Will}"
                  duration: "_{1 round}"
              - p: "_{You utter phrases in an unknown tongue, assaulting the minds of those nearby. Regardless of the result of its save, each target is then temporarily immune for 1 minute. For each additional action you use when Casting the Spell, increase the emanation's radius by 5 feet.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Unaffected.}"
                  failure: "_{Stupefied 2.}"
                  critical_failure: "_{Confused.}"
              - p: "_{Heightened (+3): the initial radius increases by 5 feet.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Unusual Anatomy}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{You transform your flesh and organs into a bizarre amalgam of glistening skin, rough scales, tufts of hair, and tumorous protuberances.}"
              - ul:
                contents:
                  - li: "_{You gain darkvision.}"
                  - li: "_{Acid oozes from your skin. Any creature that hits you with an unarmed attack or a non-reach melee weapon takes acid damage.}"
              - calc:
                output:
                  field: "##:unusual-anatomy/resistance"
                  legend: "_{Precision /\nCritical Hit\nResistance}"
                  width: large
                  eq: "floor((%{focus-rank}-5)/2)*5+10"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - calc:
                output:
                  field: "##:unusual-anatomy/damage"
                  legend: "_{Acid\nDamage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "floor((%{focus-rank}-5)/2)+2"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - p: "_{If the resistance is greater than the extra damage from a critical hit, it reduces the extra damage to 0 but doesn't reduce the attack's normal damage.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Eerie Veil}"
        contents:
          - p: "_{An ominous pall spills from your mind. Either one target takes a -1 status penalty to Will saving throws for 1 round or you gain a +2 status bonus to Will saving throws for 1 round.}"
