unit: remaster/sorcerer/bloodline/undead
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Undead}"

inc:
  - set: subclass
    value: "_{Undead}"
  - set: sorcerer-bloodline
    value: "_{Undead}"

  - set: intimidation-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Undead}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Religion}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Undeath's Blessing}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Drain Life}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Grasping Grave}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Void Warp}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Harm}"
      - "_{See the Unseen}"
      - "_{Bind Undead}"
      - "_{Talking Corpse}"
      - "_{Invoke Spirits}"
      - "_{Vampiric Exsanguination}"
      - "_{Execute}"
      - "_{Canticle of Everlasting Grief}"
      - "_{Wails of the Damned}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Undeath's Blessing}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{touch}"
                  target: "_{1 living creature}"
                  save: "_{Will}"
                  duration: "_{1 minute}"
              - p: "_{You instill within a creature the touch of the grave. For the duration, harm and heal spells treat the creature as undead. In addition, harm spells gain a status bonus to the Hit Points restored to the target. An unwilling target can attempt a Will save to reduce the effects.}"
              - calc:
                output:
                  field: "##:undeaths-blessing/bonus"
                  legend: "_{Bonus HP\nRestored by Harm}"
                  width: large
                  eq: "%{focus-rank}*2"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Heals half as much from heal and takes half as much damage from harm for 1 round.}"
                  failure: "_{Effects as described above.}"
                  critical_failure: "_{Effects as described above.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Drain Life}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 living creature}"
                  save: "_{basic Fortitude}"
              - p: "_{You close your hand and pull life energy from another creature into yourself. This deals void damage; the target must attempt a basic Fortitude save. You gain temporary Hit Points equal to the damage the target takes, after resolving its save and applying a blood magic effect if applicable. If the target's Hit Points were lower than the damage you dealt, you gain temporary Hit Points equal to their remaining Hit Points instead. The temporary Hit Points last for 1 minute.}"
              - calc:
                output:
                  field: "##:drain-life/damage"
                  legend: "_{Void\nDamage}"
                  width: large
                  suffix: "_{d4}"
                  icon: d4
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Grasping Grave}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{60ft}"
                  area: "_{20-foot radius on the ground}"
                  save: "_{Reflex}"
              - p: "_{Hundreds of skeletal arms erupt from the ground in the area, clawing at creatures within and attempting to hold them in place.}"
              - calc:
                output:
                  field: "##:grasping-grave/damage"
                  legend: "_{Slashing\nDamage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "(%{focus-rank}*2)-4"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Half damage.}"
                  failure: "_{Full damage and a -10-foot circumstance penalty to its Speeds for 1 round.}"
                  critical_failure: "_{Double damage and immobilized for 1 round or until it Escapes.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Stolen Life}"
        contents:
          - p: "_{Either gain temporary Hit Points equal to the spell's rank, lasting until the start of your next turn, or a target takes 1 void damage per spell rank (combine with the spell's own void damage before applying weaknesses and resistances).}"
