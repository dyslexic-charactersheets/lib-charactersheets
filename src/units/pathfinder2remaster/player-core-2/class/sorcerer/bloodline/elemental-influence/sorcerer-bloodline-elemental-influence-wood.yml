unit: remaster/sorcerer/bloodline/elemental/influence/wood
in: remaster/sorcerer/bloodline/elemental/influence
group: "_{Player Core 2}"
name: "_{Wood}"

inc:
  - set: sorcerer-elemental-influence
    value: "_{Wood}"
  - set: sorcerer-elemental-damage-type
    value: "_{Bludgeoning}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: tangle vine. 1st: cleanse cuisine. 2nd: resist energy. 3rd: wall of thorns. 4th: unfettered movement. 5th: elemental form. 6th: tangling creepers. 7th: energy aegis. 8th: earthquake. 9th: wrathful storm. Blood Magic damage: bludgeoning.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Tangle Vine}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Cleanse Cuisine}"
      - "_{Resist Energy}"
      - "_{Wall of Thorns}"
      - "_{Unfettered Movement}"
      - "_{Elemental Form}"
      - "_{Tangling Creepers}"
      - "_{Energy Aegis}"
      - "_{Earthquake}"
      - "_{Wrathful Storm}"
