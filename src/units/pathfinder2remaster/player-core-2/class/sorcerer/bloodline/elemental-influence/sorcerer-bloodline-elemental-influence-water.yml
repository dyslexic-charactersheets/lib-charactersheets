unit: remaster/sorcerer/bloodline/elemental/influence/water
in: remaster/sorcerer/bloodline/elemental/influence
group: "_{Player Core 2}"
name: "_{Water}"

inc:
  - set: sorcerer-elemental-influence
    value: "_{Water}"
  - set: sorcerer-elemental-damage-type
    value: "_{Bludgeoning}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: frostbite. 1st: hydraulic push. 2nd: resist energy. 3rd: aqueous orb. 4th: unfettered movement. 5th: elemental form. 6th: scintillating safeguard. 7th: energy aegis. 8th: earthquake. 9th: wrathful storm. Blood Magic damage: bludgeoning.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Frostbite}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Hydraulic Push}"
      - "_{Resist Energy}"
      - "_{Aqueous Orb}"
      - "_{Unfettered Movement}"
      - "_{Elemental Form}"
      - "_{Scintillating Safeguard}"
      - "_{Energy Aegis}"
      - "_{Earthquake}"
      - "_{Wrathful Storm}"
