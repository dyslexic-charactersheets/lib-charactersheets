unit: remaster/sorcerer/bloodline/elemental/influence/metal
in: remaster/sorcerer/bloodline/elemental/influence
group: "_{Player Core 2}"
name: "_{Metal}"

inc:
  - set: sorcerer-elemental-influence
    value: "_{Metal}"
  - set: sorcerer-elemental-damage-type
    value: "_{Piercing}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: electric arc. 1st: thunderstrike. 2nd: resist energy. 3rd: lightning bolt. 4th: unfettered movement. 5th: elemental form. 6th: chain lightning. 7th: energy aegis. 8th: earthquake. 9th: wrathful storm. Blood Magic damage: piercing.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Electric Arc}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Thunderstrike}"
      - "_{Resist Energy}"
      - "_{Lightning Bolt}"
      - "_{Unfettered Movement}"
      - "_{Elemental Form}"
      - "_{Chain Lightning}"
      - "_{Energy Aegis}"
      - "_{Earthquake}"
      - "_{Wrathful Storm}"
