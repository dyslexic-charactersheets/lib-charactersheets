unit: remaster/sorcerer/bloodline/elemental/influence/fire
in: remaster/sorcerer/bloodline/elemental/influence
group: "_{Player Core 2}"
name: "_{Fire}"

inc:
  - set: sorcerer-elemental-influence
    value: "_{Fire}"
  - set: sorcerer-elemental-damage-type
    value: "_{Fire}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: ignition. 1st: breathe fire. 2nd: resist energy. 3rd: fireball. 4th: unfettered movement. 5th: elemental form. 6th: tree of seasons. 7th: energy aegis. 8th: earthquake. 9th: wrathful storm. Blood Magic damage: fire.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Ignition}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Breathe Fire}"
      - "_{Resist Energy}"
      - "_{Fireball}"
      - "_{Unfettered Movement}"
      - "_{Elemental Form}"
      - "_{Tree of Seasons}"
      - "_{Energy Aegis}"
      - "_{Earthquake}"
      - "_{Wrathful Storm}"
