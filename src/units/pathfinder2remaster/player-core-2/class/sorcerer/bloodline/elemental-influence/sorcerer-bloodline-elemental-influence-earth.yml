unit: remaster/sorcerer/bloodline/elemental/influence/earth
in: remaster/sorcerer/bloodline/elemental/influence
group: "_{Player Core 2}"
name: "_{Earth}"

inc:
  - set: sorcerer-elemental-influence
    value: "_{Earth}"
  - set: sorcerer-elemental-damage-type
    value: "_{Bludgeoning}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: scatter scree. 1st: pummeling rubble. 2nd: resist energy. 3rd: earthbind. 4th: unfettered movement. 5th: elemental form. 6th: petrify. 7th: energy aegis. 8th: earthquake. 9th: wrathful storm. Blood Magic damage: bludgeoning.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Scatter Scree}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Pummeling Rubble}"
      - "_{Resist Energy}"
      - "_{Earthbind}"
      - "_{Unfettered Movement}"
      - "_{Elemental Form}"
      - "_{Petrify}"
      - "_{Energy Aegis}"
      - "_{Earthquake}"
      - "_{Wrathful Storm}"
