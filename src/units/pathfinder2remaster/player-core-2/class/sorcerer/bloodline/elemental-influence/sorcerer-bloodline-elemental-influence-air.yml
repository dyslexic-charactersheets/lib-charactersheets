unit: remaster/sorcerer/bloodline/elemental/influence/air
in: remaster/sorcerer/bloodline/elemental/influence
group: "_{Player Core 2}"
name: "_{Air}"

inc:
  - set: sorcerer-elemental-influence
    value: "_{Air}"
  - set: sorcerer-elemental-damage-type
    value: "_{Slashing}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: gale blast. 1st: tailwind. 2nd: resist energy. 3rd: wall of wind. 4th: unfettered movement. 5th: elemental form. 6th: chain lightning. 7th: energy aegis. 8th: earthquake. 9th: wrathful storm. Blood Magic damage: slashing.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Gale Blast}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Tailwind}"
      - "_{Resist Energy}"
      - "_{Wall of Wind}"
      - "_{Unfettered Movement}"
      - "_{Elemental Form}"
      - "_{Chain Lightning}"
      - "_{Energy Aegis}"
      - "_{Earthquake}"
      - "_{Wrathful Storm}"
