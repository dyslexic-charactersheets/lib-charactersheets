unit: remaster/sorcerer/bloodline/diabolic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Diabolic}"

inc:
  - set: subclass
    value: "_{Diabolic}"
  - set: sorcerer-bloodline
    value: "_{Diabolic}"

  - set: deception-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Diabolic}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Deception, Religion}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Diabolic Edict}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Embrace the Pit}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Hellfire Plume}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Ignition}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Charm}"
      - "_{Floating Flame}"
      - "_{Enthrall}"
      - "_{Suggestion}"
      - "_{Wave of Despair}"
      - "_{Truesight}"
      - "_{Divine Decree}"
      - "_{Divine Inspiration}"
      - "_{Falling Stars}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Diabolic Edict}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 willing living creature}"
                  duration: "_{1 round}"
              - p: "_{Demand the target perform a task: +1 status to attack rolls/skill checks related to it, or -1 status to all attack rolls/skill checks if it refuses.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Embrace the Pit}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Devil horns grow from your skull; your skin takes on features of your bloodline's devil.}"
              - calc:
                output:
                  field: "##:embrace-the-pit/resistance-fire-poison"
                  legend: "_{Fire /\nPoison\nResistance}"
                  width: large
                  eq: "floor((%{focus-rank}-3)/2)*5+5"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - calc:
                output:
                  field: "##:embrace-the-pit/resistance-physical"
                  legend: "_{Physical\nResistance\n(Except Silver)}"
                  width: large
                  eq: "floor((%{focus-rank}-3)/2)*2+1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Hellfire Plume}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{60ft}"
                  area: "_{10-foot radius, 60-foot-tall cylinder}"
                  save: "_{basic Reflex}"
              - p: "_{A plume of hellfire erupts from below, dealing fire and spirit damage.}"
              - calc:
                output:
                  field: "##:hellfire-plume/damage"
                  legend: "_{Fire /\nSpirit Damage\n(Each)}"
                  width: large
                  suffix: "_{d6 each}"
                  icon: d6
                  eq: "%{focus-rank}-1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Tongue of Flame}"
        contents:
          - p: "_{A target takes 1 fire damage/rank (combine with the spell's own fire damage before weaknesses/resistances), or you gain +2 status to Deception checks for 1 round.}"
