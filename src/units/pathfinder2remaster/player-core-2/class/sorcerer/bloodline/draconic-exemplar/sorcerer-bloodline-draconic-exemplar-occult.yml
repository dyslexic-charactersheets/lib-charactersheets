unit: remaster/sorcerer/bloodline/draconic/exemplar/occult
in: remaster/sorcerer/bloodline/draconic/exemplar
group: "_{Player Core 2}"
name: "_{Occult}"

inc:
  - set: occultism-proficiency
    value: trained

  - set: sorcerer-draconic-exemplar
    value: "_{Occult}"
  - set: sorcerer-bloodline-tradition
    value: "_{Occult}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Occultism}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: shield. 1st: fear. 2nd: blood vendetta. 4th: fly. 5th: slither. 7th: mask of terror. 8th: unrelenting observation. 9th: overwhelming presence.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Shield}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Fear}"
      - "_{Blood Vendetta}"
      - "_{Haste}"
      - "_{Fly}"
      - "_{Slither}"
      - "_{Dragon Form}"
      - "_{Mask of Terror}"
      - "_{Unrelenting Observation}"
      - "_{Overwhelming Presence}"
