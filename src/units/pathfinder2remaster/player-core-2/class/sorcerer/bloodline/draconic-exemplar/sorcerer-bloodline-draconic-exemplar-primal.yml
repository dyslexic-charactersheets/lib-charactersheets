      - "_{Shatter}"
      - "_{Haste}"
      - "_{Fly}"
      - "_{Howling Blizzard}"
      - "_{Dragon Form}"
      - "_{Mask of Terror}"
      - "_{Earthquake}"
      - "_{Overwhelming Presence}"
