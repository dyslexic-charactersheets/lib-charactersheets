unit: remaster/sorcerer/bloodline/draconic/exemplar/divine
in: remaster/sorcerer/bloodline/draconic/exemplar
group: "_{Player Core 2}"
name: "_{Divine}"

inc:
  - set: religion-proficiency
    value: trained

  - set: sorcerer-draconic-exemplar
    value: "_{Divine}"
  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Religion}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: shield. 1st: fear. 2nd: augury. 4th: fly. 5th: divine immolation. 7th: mask of terror. 8th: divine inspiration. 9th: overwhelming presence.}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Shield}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Fear}"
      - "_{Augury}"
      - "_{Haste}"
      - "_{Fly}"
      - "_{Divine Immolation}"
      - "_{Dragon Form}"
      - "_{Mask of Terror}"
      - "_{Divine Inspiration}"
      - "_{Overwhelming Presence}"
