unit: remaster/sorcerer/bloodline/fey
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Fey}"

inc:
  - set: subclass
    value: "_{Fey}"
  - set: sorcerer-bloodline
    value: "_{Fey}"

  - set: deception-proficiency
    value: trained
  - set: nature-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Fey}"

  - set: sorcerer-bloodline-tradition
    value: "_{Primal}"
  - set: sorcerer-bloodline-skills
    value: "_{Deception, Nature}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Faerie Dust}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Fey Disappearance}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Fey Glamour}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Figment}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Charm}"
      - "_{Laughing Fit}"
      - "_{Enthrall}"
      - "_{Suggestion}"
      - "_{Hallucination}"
      - "_{Mislead}"
      - "_{Visions of Danger}"
      - "_{Uncontrollable Dance}"
      - "_{Metamorphosis}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action: "13"
        contents:
          - article:
            title: "_{Faerie Dust}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  area: "_{5-foot burst or more}"
                  save: "_{Will}"
              - p: "_{Magical dust makes those in the area easier to trick. Each extra action spent casting adds 5ft to the radius.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Unaffected.}"
                  failure: "_{Can't use reactions; -2 status to Perception checks and Will saves.}"
                  critical_failure: "_{As failure, plus -1 status to Perception checks and Will saves for 1 minute.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Fey Disappearance}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{until the end of your next turn}"
              - p: "_{Become invisible and ignore natural difficult terrain. A hostile action ends the invisibility (terrain ignore continues).}"
              - p: "_{Heightened (5th): if you use a hostile action, the invisibility doesn't end.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Fey Glamour}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{30ft}"
                  area: "_{30-foot burst or up to 10 willing creatures}"
                  duration: "_{10 minutes}"
              - p: "_{Cloak the area or targets in illusion: as illusory scene (area) or illusory disguise (creatures), heightened 1 rank lower, using this spell's range and duration.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Cloak of Ribbons}"
        contents:
          - p: "_{Gain +2 status to Performance checks for 1 round, or become concealed for 1 round (too obvious to Hide with).}"
