unit: remaster/sorcerer/bloodline/hag
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Hag}"

inc:
  - set: subclass
    value: "_{Hag}"
  - set: sorcerer-bloodline
    value: "_{Hag}"

  - set: deception-proficiency
    value: trained
  - set: occultism-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Hag}"

  - set: sorcerer-bloodline-tradition
    value: "_{Occult}"
  - set: sorcerer-bloodline-skills
    value: "_{Deception, Occultism}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Jealous Hex}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Horrific Visage}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{You're Mine}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Daze}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Illusory Disguise}"
      - "_{Stupefy}"
      - "_{Blindness}"
      - "_{Outcast's Curse}"
      - "_{Mariner's Curse}"
      - "_{Cursed Metamorphosis}"
      - "_{Warp Mind}"
      - "_{Quandary}"
      - "_{Phantasmagoria}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Jealous Hex}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 creature}"
                  save: "_{Will}"
                  duration: "_{1 minute}"
              - p: "_{You draw forth a hag's innate jealousy to deny a target its greatest attribute. The target is cursed with an adverse condition depending on its highest attribute modifier: Strength (enfeebled); Dexterity (clumsy); Constitution (drained); or Intelligence, Wisdom, or Charisma (stupefied). On a tie, the creature decides which of the conditions associated with the tied attribute to take. The target must attempt a Will save. At the start of each of your turns, the target can attempt another Will save, ending the effect on a success.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Unaffected.}"
                  failure: "_{The condition's value is 1.}"
                  critical_failure: "_{The condition's value is 2.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Horrific Visage}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  area: "_{30-foot-radius emanation}"
                  save: "_{Will}"
              - p: "_{You briefly transform your features into the horrific visage of a hag, striking fear into your enemies. Foes in the area must attempt a Will save.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Unaffected.}"
                  failure: "_{Frightened 1.}"
                  critical_failure: "_{Frightened 2.}"
              - p: "_{Heightened (5th): foes in the area are frightened 1 on a success, frightened 2 on a failure, and frightened 3 and fleeing for 1 round on a critical failure. They are still unaffected on a critical success.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{You're Mine}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 creature}"
                  save: "_{Will}"
                  duration: "_{1 round}"
              - p: "_{You manipulate the target's emotions, potentially allowing you to control it for a brief instant. The target must attempt a Will save.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Stunned 1.}"
                  failure: "_{On the target's next turn, it's stunned 1, and you partially control it, causing it to take a single action of your choice. If it has actions left, it can act normally.}"
                  critical_failure: "_{Controlled for 1 round.}"
              - p: "_{Heightened (7th): on a failure, the target is controlled for 1 round. On a critical failure, the target is controlled for up to 1 minute; it receives a new Will save at the end of each of its turns, ending the spell on a success.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Retributive Spite}"
        contents:
          - p: "_{You deal 4 mental damage per spell rank (basic Will save) to the first creature that damages you before your next turn ends, or gain temporary Hit Points equal to the spell's rank (lasting until the turn after next) if none do.}"
