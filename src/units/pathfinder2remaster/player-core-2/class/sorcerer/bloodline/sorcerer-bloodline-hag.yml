unit: remaster/sorcerer/bloodline/hag
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Hag}"

inc:
  - set: subclass
    value: "_{Hag}"
  - set: sorcerer-bloodline
    value: "_{Hag}"

  - set: deception-proficiency
    value: trained
  - set: occultism-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Hag}"

  - set: sorcerer-bloodline-tradition
    value: "_{Occult}"
  - set: sorcerer-bloodline-skills
    value: "_{Deception, Occultism}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: daze. 1st: illusory disguise. 2nd: stupefy. 3rd: blindness. 4th: outcast's curse. 5th: mariner's curse. 6th: cursed metamorphosis. 7th: warp mind. 8th: quandary. 9th: phantasmagoria.}"

  - set: sorcerer-bloodline-spell-initial
    value: "_{Jealous Hex}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Horrific Visage}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{You're Mine}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Daze}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Illusory Disguise}"
      - "_{Stupefy}"
      - "_{Blindness}"
      - "_{Outcast's Curse}"
      - "_{Mariner's Curse}"
      - "_{Cursed Metamorphosis}"
      - "_{Warp Mind}"
      - "_{Quandary}"
      - "_{Phantasmagoria}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Jealous Hex}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Curse a creature that outshines you, dealing mental damage that worsens the more successful it's been.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Horrific Visage}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Reveal your true, horrific visage, frightening creatures who see it.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{You're Mine}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{Bewitch a creature, dominating its mind and forcing it to act on your behalf.}"

  - set: sorcerer-blood-magic-initial
    value: "_{Retributive Spite—You deal mental damage to the first creature that damages you before the end of your next turn, or gain temporary Hit Points if none do.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Blood Magic—Retributive Spite}"
        contents:
          - p: "_{You deal 4 mental damage per spell rank (basic Will save) to the first creature that damages you before your next turn ends, or gain temporary Hit Points equal to the spell's rank (lasting until the turn after next) if none do.}"
