unit: remaster/sorcerer/bloodline/elemental
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Elemental}"

form:
  - select: remaster/sorcerer/bloodline/elemental/influence
    name: "_{Elemental Influence}"
    max: 1

inc:
  - set: subclass
    value: "_{Elemental}"
  - set: sorcerer-bloodline
    value: "_{Elemental}"

  - set: intimidation-proficiency
    value: trained
  - set: nature-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Elemental}"

  - set: sorcerer-bloodline-tradition
    value: "_{Primal}"
  - set: sorcerer-bloodline-skills
    value: "_{Intimidation, Nature}"

  - set: sorcerer-bloodline-spell-initial
    value: "_{Elemental Toss}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Elemental Motion}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Elemental Blast}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Elemental Toss}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 creature}"
                  save: "_{AC}"
              - p: "_{Fling elemental matter at your foe. Ranged spell attack roll: damage on a success, double on a critical success. Damage type matches your influence (e.g. slashing for air, fire for fire); has your element's trait.}"
              - calc:
                output:
                  field: "##:elemental-toss/damage"
                  legend: "_{Damage}"
                  width: large
                  suffix: "_{d8}"
                  icon: d8
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Elemental Motion}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Your element propels you, improving your Speed by type. Has your element's trait.}"
              - ul:
                contents:
                  - li: "_{Air/Fire: fly Speed equal to your Speed.}"
                  - li: "_{Earth/Metal: burrow Speed 10ft.}"
                  - li: "_{Water: swim Speed equal to your Speed; breathe underwater.}"
                  - li: "_{Wood: climb Speed equal to your Speed.}"
              - p: "_{Heightened (6th): +10ft status bonus to your Speeds.}"
              - p: "_{Heightened (9th): the status bonus increases to +20 feet.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Elemental Blast}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{30ft (burst only)}"
                  area: "_{10-foot-radius burst, 30-foot cone, or 60-foot line}"
                  save: "_{basic Reflex}"
              - p: "_{Blast foes in your choice of the listed shapes. Damage type matches your influence (e.g. slashing for air, fire for fire); has your element's trait.}"
              - calc:
                output:
                  field: "##:elemental-blast/damage"
                  legend: "_{Damage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "(%{focus-rank}*2)-2"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Elemental Fury}"
        contents:
          - p: "_{Gain +2 status to Intimidation checks for 1 round, or a target takes 1 damage/rank of your influence's type (combine with the spell's own damage of that type before weaknesses/resistances).}"

  - at: '@sorcerer/bloodline/extra-field'
    add:
      - field: sorcerer-elemental-influence
        label: "_{Influence}"
        width: stretch
        merge-bottom: true
      - field: sorcerer-elemental-damage-type
        label: "_{Damage Type}"
        width: stretch
        merge-bottom: true

  - copy: sorcerer/elemental-influence/spells
    contents:
      - at: '@sorcerer/spells-list/granted-cantrip'
        replace:
          - "#{cantrip}"

      - at: '@sorcerer/spells-list/granted-spells'
        replace:
          - "#{first}"
          - "_{Resist Energy}"
          - "#{third}"
          - "_{Unfettered Movement}"
          - "_{Elemental Form}"
          - "#{sixth}"
          - "_{Energy Aegis}"
          - "_{Earthquake}"
          - "_{Wrathful Storm}"
