unit: remaster/sorcerer/bloodline/draconic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Draconic}"

form:
  - select: remaster/sorcerer/bloodline/draconic/exemplar
    name: "_{Draconic Exemplar}"
    max: 1

inc:
  - set: subclass
    value: "_{Draconic}"
  - set: sorcerer-bloodline
    value: "_{Draconic}"

  - set: intimidation-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Draconic}"

  - set: sorcerer-bloodline-spell-initial
    value: "_{Flurry of Claws}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Dragon Breath}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Dragon Wings}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Flurry of Claws}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{2 creatures no more than 10 feet from each other}"
                  save: "_{AC}"
              - p: "_{Dragon claws slash two nearby foes. Spell attack roll against each (counts as two attacks, but MAP doesn't increase until both are made). On a hit: slashing plus tradition-based damage (arcane force, divine spirit, occult mental, or primal fire).}"
              - calc:
                output:
                  field: "##:flurry-of-claws/damage"
                  legend: "_{Slashing\nDamage}"
                  width: large
                  suffix: "_{d8}"
                  icon: d8
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - calc:
                output:
                  field: "##:flurry-of-claws/additional-damage"
                  legend: "_{Additional\nDamage}"
                  width: large
                  suffix: "_{d4}"
                  icon: d4
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Dragon Breath}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  area: "_{30-foot cone}"
                  save: "_{basic Reflex}"
              - p: "_{Spew energy from your mouth: damage type is tradition-based (arcane force, divine spirit, occult mental, or primal fire).}"
              - calc:
                output:
                  field: "##:dragon-breath/damage"
                  legend: "_{Damage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "(%{focus-rank}*2)-1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action: 2
        contents:
          - article:
            title: "_{Dragon Wings}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Wings grant a fly Speed of 60ft or your Speed, whichever is faster. On expiry, float down as gentle landing.}"
              - p: "_{Heightened (8th): the duration increases to 10 minutes.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Scaly Hide}"
        contents:
          - p: "_{Scales grow on you or one target: +1 status to AC for 1 round.}"

  - at: '@sorcerer/bloodline/extra-field'
    add:
      - field: sorcerer-draconic-exemplar
        label: "_{Exemplar}"
        width: stretch
        merge-bottom: true

  - copy: sorcerer/draconic-exemplar/spells
    contents:
      - at: '@sorcerer/spells-list/granted-cantrip'
        replace:
          - "_{Shield}"

      - at: '@sorcerer/spells-list/granted-spells'
        replace:
          - "_{Fear}"
          - "#{second}"
          - "_{Haste}"
          - "_{Fly}"
          - "#{fifth}"
          - "_{Dragon Form}"
          - "_{Mask of Terror}"
          - "#{eighth}"
          - "_{Overwhelming Presence}"
