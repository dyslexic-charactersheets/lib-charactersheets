unit: remaster/sorcerer/bloodline/angelic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Angelic}"

require:
  - unit: remaster/focus/sorcerer/angelic-halo
  - unit: remaster/focus/sorcerer/angelic-wings
  - unit: remaster/focus/sorcerer/celestial-brand

inc:
  - set: subclass
    value: "_{Angelic}"
  - set: sorcerer-bloodline
    value: "_{Angelic}"

  - set: diplomacy-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Angelic}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Diplomacy, Religion}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Angelic Halo}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Angelic Wings}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Celestial Brand}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Light}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Heal}"
      - "_{Spiritual Armament}"
      - "_{Holy Light}"
      - "_{Divine Wrath}"
      - "_{Divine Immolation}"
      - "_{Blessed Boundary}"
      - "_{Divine Decree}"
      - "_{Moment of Renewal}"
      - "_{Foresight}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - paste: remaster/focus/sorcerer/angelic-halo

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - paste: remaster/focus/sorcerer/angelic-wings

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - paste: remaster/focus/sorcerer/celestial-brand

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Divine Aura}"
        contents:
          - p: "_{You or one target gains +1 status to saving throws for 1 round.}"
