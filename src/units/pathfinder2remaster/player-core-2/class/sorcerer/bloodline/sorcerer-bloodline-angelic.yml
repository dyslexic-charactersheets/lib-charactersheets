unit: remaster/sorcerer/bloodline/angelic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Angelic}"

inc:
  - set: subclass
    value: "_{Angelic}"
  - set: sorcerer-bloodline
    value: "_{Angelic}"

  - set: diplomacy-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Angelic}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Diplomacy, Religion}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Angelic Halo}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Angelic Wings}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Celestial Brand}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Light}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Heal}"
      - "_{Spiritual Armament}"
      - "_{Holy Light}"
      - "_{Divine Wrath}"
      - "_{Divine Immolation}"
      - "_{Blessed Boundary}"
      - "_{Divine Decree}"
      - "_{Moment of Renewal}"
      - "_{Foresight}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Angelic Halo}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  area: "_{15-foot emanation}"
                  duration: "_{1 minute}"
              - p: "_{Allies in your halo's emanation healed by a heal spell gain bonus HP regained equal to double the heal spell's rank.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Angelic Wings}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{3 rounds}"
              - p: "_{Wings of light grant a fly Speed equal to your Speed and bright light in a 30ft radius. On expiry, float down as gentle landing.}"
              - p: "_{Heightened (5th): the duration increases to 1 minute.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action:
        contents:
          - article:
            title: "_{Celestial Brand}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 unholy creature}"
                  duration: "_{1 round}"
              - p: "_{A symbol curses the target: you and allies get +1 status to attack rolls/skill checks against it, and holy creatures dealing damage add 1d4 spirit damage plus the bonus below. Then immune for 1 minute.}"
              - calc:
                output:
                  field: "##:celestial-brand/damage"
                  legend: "_{Bonus\nSpirit Damage}"
                  width: large
                  eq: "floor((%{focus-rank}-5)/2)"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Divine Aura}"
        contents:
          - p: "_{You or one target gains +1 status to saving throws for 1 round.}"
