unit: remaster/sorcerer/bloodline/angelic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Angelic}"

inc:
  - set: subclass
    value: "_{Angelic}"
  - set: sorcerer-bloodline
    value: "_{Angelic}"

  - set: diplomacy-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Angelic}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Diplomacy, Religion}"
  - set: sorcerer-bloodline-granted-spells
    value: "_{Cantrip: light. 1st: heal. 2nd: spiritual armament. 3rd: holy light. 4th: divine wrath. 5th: divine immolation. 6th: blessed boundary. 7th: divine decree. 8th: moment of renewal. 9th: foresight.}"

  - set: sorcerer-bloodline-spell-initial
    value: "_{Angelic Halo}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Angelic Wings}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Celestial Brand}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Light}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Heal}"
      - "_{Spiritual Armament}"
      - "_{Holy Light}"
      - "_{Divine Wrath}"
      - "_{Divine Immolation}"
      - "_{Blessed Boundary}"
      - "_{Divine Decree}"
      - "_{Moment of Renewal}"
      - "_{Foresight}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Angelic Halo}"
            cat: "_{Focus 1}"
            contents:
              - p: "_{Surround yourself with a halo of holy light, healing allies who end their turn within it.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Angelic Wings}"
            cat: "_{Focus 4}"
            contents:
              - p: "_{Sprout wings of light, gaining a fly Speed for a short time.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action:
        contents:
          - article:
            title: "_{Celestial Brand}"
            cat: "_{Focus 8}"
            contents:
              - p: "_{Brand a foe with holy light, making it easier for you and your allies to strike it true.}"

  - set: sorcerer-blood-magic-initial
    value: "_{Divine Aura—You project a warming aura that protects you or one target, granting a +1 status bonus to saving throws for 1 round.}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Blood Magic—Divine Aura}"
        contents:
          - p: "_{You project a warming aura that protects you or one target, granting a +1 status bonus to saving throws for 1 round.}"
