unit: remaster/sorcerer/bloodline/angelic
in: remaster/sorcerer/bloodline
group: "_{Player Core 2}"
name: "_{Angelic}"

inc:
  - set: subclass
    value: "_{Angelic}"
  - set: sorcerer-bloodline
    value: "_{Angelic}"

  - set: diplomacy-proficiency
    value: trained
  - set: religion-proficiency
    value: trained

  - at: '@sorcerer/bloodline/title'
    replace:
      - h4: "_{Angelic}"

  - set: sorcerer-bloodline-tradition
    value: "_{Divine}"
  - set: sorcerer-bloodline-skills
    value: "_{Diplomacy, Religion}"
  - set: sorcerer-bloodline-spell-initial
    value: "_{Angelic Halo}"
  - set: sorcerer-bloodline-spell-advanced
    value: "_{Angelic Wings}"
  - set: sorcerer-bloodline-spell-greater
    value: "_{Celestial Brand}"

  - at: '@sorcerer/spells-list/granted-cantrip'
    replace:
      - "_{Light}"

  - at: '@sorcerer/spells-list/granted-spells'
    replace:
      - "_{Heal}"
      - "_{Spiritual Armament}"
      - "_{Holy Light}"
      - "_{Divine Wrath}"
      - "_{Divine Immolation}"
      - "_{Blessed Boundary}"
      - "_{Divine Decree}"
      - "_{Moment of Renewal}"
      - "_{Foresight}"

  - at: '@sorcerer/bloodline-spell/initial'
    replace:
      - action:
        contents:
          - article:
            title: "_{Angelic Halo}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  area: "_{15-foot emanation}"
                  duration: "_{1 minute}"
              - p: "_{You gain an angelic halo with an aura that increases allies' healing from the heal spell. Allies in your halo's emanation who are healed by a heal spell gain a status bonus to Hit Points regained equal to double the heal spell's level.}"

  - at: '@sorcerer/bloodline-spell/advanced'
    replace:
      - action:
        contents:
          - article:
            title: "_{Angelic Wings}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{3 rounds}"
              - p: "_{Wings of pure light spread out from your back, granting you a fly Speed equal to your Speed. Your wings cast bright light in a 30-foot radius. When this spell's duration would end, if you're still flying, you float to the ground, as gentle landing.}"
              - p: "_{Heightened (5th): the duration increases to 1 minute.}"

  - at: '@sorcerer/bloodline-spell/greater'
    replace:
      - action:
        contents:
          - article:
            title: "_{Celestial Brand}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 unholy creature}"
                  duration: "_{1 round}"
              - p: "_{A blazing symbol appears on the target, cursing it to face divine justice. You and your allies gain a +1 status bonus to attack rolls and skill checks against it. Anytime a holy creature damages it, the holy creature deals an additional 1d4 spirit damage plus the bonus below. The target is then temporarily immune for 1 minute.}"
              - calc:
                output:
                  field: "##:celestial-brand/damage"
                  legend: "_{Bonus\nSpirit Damage}"
                  width: large
                  eq: "floor((%{focus-rank}-5)/2)"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"

  - at: '@sorcerer/spellbook/blood-magic'
    replace:
      - article:
        title: "_{Divine Aura}"
        contents:
          - p: "_{You project a warming aura that protects you or one target, granting a +1 status bonus to saving throws for 1 round.}"
