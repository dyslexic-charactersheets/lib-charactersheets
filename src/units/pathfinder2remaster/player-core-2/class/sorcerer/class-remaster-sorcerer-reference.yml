# add Sorcerous Potency
# Blood Magic redesign
# Elemental bloodline -> Elemental Influence as a new selectable 
# Draconic bloodline -> Draconic Exemplar, another selectable
# Metamagic -> Spellshape

unit: class/remaster/sorcerer/reference
name: "_{Sorcerer Reference}"
group: "_{Player Core 2}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Sorcerer}"
      - p: >
          _{You didn't choose to become a spellcaster—you were born one. There's
          magic in your blood. Perhaps a divine influence blessed one of your
          ancestors, a forebear communed with an ancient, primordial entity, or a
          powerful occult ritual performed long ago influenced your lineage.
          Self-reflection and study allow you to refine your inherent magical skills
          and unlock new, more powerful abilities. The power in your blood carries a
          risk, however, and you constantly face the choice of whether you'll rise to
          become a master spellcaster or fall into destruction.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You use spells to injure your enemies, influence their minds, and hamper
          their movements. You might be too vulnerable to leap directly into melee
          combat, or your bloodline might give you abilities that help you hold your
          own in a brawl. While your magic is strong, you also rely on cantrips in
          order to conserve your more powerful spells for the right moment (or after
          you've used such spells up).}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{Your natural charisma makes you good at interacting with people.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You detect the magic around you, finding treasures and warning your party
          of magical traps. When your group encounters mysteries or problems related
          to your bloodline, you try to solve them.}

      - paste: book-ref
        params:
          page-ref: "_{PC2 p144}"

  - at: '@reference/actions'
    add:
      - paste: reference/action-refocus

  - at: '@reference/action-traits'
    add:
      - concentrate
      - manipulate
