unit: class/remaster/monk/reference
name: "_{Monk Reference}"
group: "_{Player Core 2}"

inc:
  - at: '@reference/class-details'
    add:
      - h4: "_{Monk}"
      - p: >
          _{The strength of your fist flows from your mind and spirit. You seek perfection,
          honing your body into a flawless instrument and your mind into an orderly bastion
          of wisdom. You're a fierce combatant renowned for martial arts skills and combat
          stances that grant you unique fighting moves. While the challenge of mastering
          many fighting styles drives you to great heights, you also enjoy meditating on
          philosophical questions and discovering new ways to obtain peace and enlightenment.}
        size: large
      - p:
        title: "_{During combat encounters...}"
        optional: true
        content: >
          _{You speed into the fray, dodging or leaping past obstacles with acrobatic
          maneuvers. You strike opponents in a rapid flurry of attacks, using your bare
          fists or wielding specialized weapons that you mastered during your monastic
          training. Stances let you change up your combat style for different situations,
          and qi abilities allow you to perform mystic feats like healing yourself and
          soaring through the air.}
      - p:
        title: "_{During social encounters...}"
        optional: true
        content: >
          _{Your perceptiveness lets you see through falsehoods, and your philosophical
          training provides insight into any situation.}
      - p:
        title: "_{While exploring...}"
        optional: true
        content: >
          _{You climb up walls, dodge traps, overcome obstacles, and leap over pits. You
          usually stay toward the outside of the group to protect more vulnerable members,
          and you're well suited to looking for danger or moving stealthily.}

      - paste: book-ref
        params:
          page-ref: "_{PC2 p115}"

  - at: '@reference/actions'
    add:
      - paste: reference/action-refocus
      - paste: reference/action-sustain
      - action:
        contents:
          - p:
            title: "_{Flurry of Blows}"
            content: "_{Make two unarmed Strikes with any body part. If both hit the same creature, combine their damage.}"
      - zone: '@monk/reference/actions'

  - at: '@reference/action-traits'
    add:
      - stance
      - flourish
      - concentrate
      - incapacitation

  - at: '@reference/weapon-traits'
    add:
      - unarmed
      - nonlethal
