unit: monk/stance/remaster/monastic-archer
in: monk/stance
level: 1
group: "_{Player Core 2}"
name: "_{Monastic Archer Stance}"

require:
  - unit: class/remaster/monk/defs

inc:
  - copy: monk/stance/monastic-archer
    contents:
      - g:
        name: "_{Monastic Archer Stance}"
        contents:
          - selectable: monk/stance/monastic-archer
            contents:
              - article: monk/stance/monastic-archer
                title: "_{Monastic Archer Stance}"
                cat: "_{Feat}"
                merge-bottom: false
                contents:
                  - p: "_{Requires unarmoured, wielding a longbow, shortbow, or monk-trait bow. While in this stance, you can only Strike with such bows, though you can still use Flurry of Blows and other monk feats/abilities that need unarmed attacks (within half the weapon's first range increment), unless they require one specific Strike.}"
                  - p: "_{Special: you're trained in longbow, shortbow, and simple or martial bows with the monk trait; they scale to expert or master with your Expert or Master Strikes.}"

          - selectable: monk/stance/monastic-archer/return-fire
            contents:
              - article:
                title: "_{Return Fire}"
                cat: "_{Feat}"
                contents:
                  - p: "_{Prerequisites: Deflect Projectile, Monastic Archer Stance. Requires being in the stance, wielding a bow, and a free hand. When you successfully Deflect an arrow, fire it back as part of that reaction with a ranged bow Strike.}"

          - selectable: monk/stance/monastic-archer/focused-shot
            contents:
              - article:
                title: "_{Focused Shot}"
                cat: "_{Feat}"
                contents:
                  - action: 1
                    contents:
                      - p: "_{Prerequisites: Monastic Archer Stance. Requires being in Monastic Archer Stance. Make a ranged weapon Strike against a target within your weapon's first range increment. Ignores the target's concealed condition and all cover.}"

  - at: '@monk/stances'
    add:
      - paste: monk/stance/monastic-archer

  - at: '@monk/stance-actions'
    add:
      - action:
        order: 2
        contents:
          - p:
            title: "_{Monastic Archer Stance}"
            content: "_{A martial art centred on the bow. Only Strikes with longbows, shortbows, or bows with the monk trait; can Flurry of Blows with them.}"

  - at: '@reference/actions'
    add:
      - action:
        contents:
          - p:
            title: "_{Monastic Archer Stance}"
            content: "_{A martial art centred on the bow. Only Strikes with longbows, shortbows, or bows with the monk trait.}"
