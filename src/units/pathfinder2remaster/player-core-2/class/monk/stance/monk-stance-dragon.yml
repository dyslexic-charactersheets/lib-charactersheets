unit: monk/stance/remaster/dragon
in: monk/stance
level: 1
group: "_{Player Core 2}"
name: "_{Dragon Stance}"

require:
  - unit: class/remaster/monk/defs

inc:
  - copy: monk/stance/dragon
    contents:
      - g:
        name: "_{Dragon Stance}"
        contents:
          - selectable: monk/stance/dragon
            contents:
              - paste: monk/stance
                params:
                  id: dragon
                  title: "_{Dragon Stance}"
                contents:
                  - p: "_{Requires unarmoured. Ignore the first square of difficult terrain while Striding.}"

          - paste: monk/stance-attack/str
            params:
              id: dragon-tail
              name: "_{Dragon Tail Attack}"
              dmg: "_{d10}"
              type: "_{B}"
            contents:
              - flags:
                  - "_{Backswing}"
                  - "_{Nonlethal}"
                  - "_{Unarmed}"

          - selectable: monk/stance/dragon/dragon-roar
            contents:
              - article:
                title: "_{Dragon Roar}"
                cat: "_{Feat}"
                contents:
                  - action:
                    contents:
                      - row:
                        contents:
                          - value: "_{15ft}"
                            label: "_{Range}"
                            frame: above
                          - p: "_{Requires being in Dragon Stance. Will vs your Intimidation DC.}"
                          - paste: inline-save
                            params:
                              failure: "_{Frightened 1}"
                              critical_failure: "_{Frightened 2}"
                      - row:
                        contents:
                          - value: "+4"
                          - p: "_{To your first attack against a frightened creature before your next turn ends. Can't reuse for 1d4 rounds, or after leaving Dragon Stance.}"

  - at: '@monk/stances'
    add:
      - paste: monk/stance/dragon

  - at: '@monk/stance-actions'
    add:
      - action:
        order: 2
        contents:
          - p:
            title: "_{Dragon Stance}"
            content: "_{Enter dragon stance. Make dragon tail strikes.}"
      - action:
        order: 3
        contents:
          - row:
            contents:
              - p:
                title: "_{Dragon Tail Attack}"
                content: "_{Unarmed attack that deals bludgeoning damage.}"
              - field: dragon-tail-damage
                label: "_{Damage}"
                control: value
                value: "d10"

  - at: '@reference/actions'
    add:
      - action:
        contents:
          - p:
            title: "_{Dragon Stance}"
            content: "_{Enter dragon stance. Make powerful leg strikes.}"

  - at: '@reference/weapon-traits'
    add:
      - backswing
      - nonlethal
      - unarmed
