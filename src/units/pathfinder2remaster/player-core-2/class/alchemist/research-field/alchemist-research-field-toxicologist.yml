unit: remaster/alchemist/research-field/toxicologist
in: remaster/alchemist/research-field
group: "_{Player Core 2}"
name: "_{Toxicologist}"

inc:
  - set: alchemist-research-field
    value: "_{Toxicologist}"
    
  - at: '@alchemist/research-field'
    replace:
      - g:
        contents:
          - h4: "_{Toxicologist}"
          - hr:
            swash: true

          - layout: 2e
            contents:
              - g:
                contents:
                  - h5: "_{Field Benefit}"
                  - action:
                    contents:
                      - p: "_{Apply a poison to a weapon.}"
                  - p: "_{Your infused poisons can affect creatures immune to poison, dealing acid damage instead of poison damage.}"

              - g:
                contents:
                  - h5: "_{Field Vials}"
                  - p: "_{Your versatile vials are poison instead of acid.}"
                  - p: "_{You can apply a vial to a weapon as an injury poison that deals the vial's initial damage.}"

      - level: 5
        contents:
          - h5: "_{Field Discovery}"
          - calc:
            output:
              field: "##:poison-resistance"
              legend: "_{Poison Resistance}"
              width: large
              border: full
              eq: "floor(%{level}/2)"
            inputs:
              - field:
                ref: level
                label: "_{Level}"
              - span: "&div; 2"

      - level: 11
        contents:
          - h5: "_{Advanced Vials}"
          - p: "_{When you damage a creature with a vial used as an injury poison, deal persistent poison damage equal to its splash damage.}"

      - level: 13
        contents:
          - h5: "_{Greater Field Discovery}"
          - p: "_{When a creature fails its save against your infused injury poison, a second creature next to it is exposed to the poison.}"
          
  - at: '@alchemist/research-field/formulas'
    replace:
      - table: "##:formulas"
        field_frame: none
        width: stretch
        merge-bottom: true
        columns:
          - label: "_{Poison}"
            align: left
          - "_{Level}"
          - "_{Action}"
          - "_{Activate}"
          - "_{Stages}"
        rows:
          - n: 1
          - n: 2
        template:
          - field: alchemist-poison-#{i}
            width: stretch
            # label: "_&nbsp;"
            underlay: "#{n}"
          - field: alchemist-poison-#{i}-level
            width: small

          - field: alchemist-poison-#{i}-action
            control: icon
            icon: action-template

          - field: alchemist-poison-#{i}-activate
            width: huge
          - field: alchemist-poison-#{i}-stages
            width: stretch

  - at: '@formula-book/left'
    replace:
      - list:
        zebra: true
        hr: true
        flex: true
        contents:
          - repeat: 4
            index: j
            contents:
              - article: formula-book-poison-#{j}
                show-level: true
                header:
                  - row:
                    contents:
                      - field: 'formula-book-poison-#{j}'
                        width: stretch
                        align: left
                        legend: "_{Poison}"
                      - field: 'formula-book-poison-#{j}-level'
                        label: "_{Level}"

                contents:
                  - action: template
                    contents:
                      - row:
                        contents:
                          - field: formula-book-poison-#{j}-activate
                            label: "_{Activate}"
                            width: stretch
                          - field: formula-book-poison-#{j}-method
                            label: "_{Method}"
                            width: stretch

                  - row:
                    contents:
                      - field: "##:formula-book-poison-#{j}-onset"
                        label: "_{Onset}"
                        width: stretch
                      - field: "##:formula-book-poison-#{j}-save"
                        label: "_{Saving Throw}"
                        width: stretch
                        align: right
                      - field: formula-book-poison-#{j}-save-dc
                        label: "_{DC}"
                        icon: dc
                        border: full

                  - list:
                    contents:
                      - row:
                        contents:
                          - p:
                            title: "_{Stage 1}"
                          - field: formula-book-poison-#{j}-stage-1
                      - row:
                        contents:
                          - p:
                            title: "_{Stage 2}"
                          - field: formula-book-poison-#{j}-stage-2
                      - row:
                        contents:
                          - p:
                            title: "_{Stage 3}"
                          - field: formula-book-poison-#{j}-stage-3

                  - field: 'formula-book-poison-#{j}-details'
                    width: stretch
                    align: left
                    frame: none
                    repeat: 2
                    reduce: 1
                  - row:
                    contents:
                      - field: 'formula-book-poison-#{j}-final'
                        width: stretch
                      - field: 'formula-book-poison-#{j}-ref'
                        icon: book
                        label: "_{Source}"
                        align: left
                        width: huge
                        control: compound
                        parts:
                          - width: large
                          - span: 'p'
                          - width: large
                            align: left