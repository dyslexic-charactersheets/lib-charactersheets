unit: remaster/investigator/methodology/empiricism
in: remaster/investigator/methodology
group: "_{Player Core 2}"
name: "_{Empiricism}"

inc:
  - set: subclass
    value: "_{Empiricism}"

  - set: investigator-methodology
    value: "_{Empiricism}"

  - at: '@investigator/methodology'
    replace:
      - h4: "_{Empiricism}"
      - hr:
        swash: true
      - layout: 2e
        contents:
          - g:
            contents:
              - action: free
                contents:
                  - article:
                    title: "_{Expeditious Inspection}"
                    content: "_{Once per 10 minutes: Recall Knowledge, Seek, or Sense Motive.}"
              - spacer:

          - g:
            contents:
              - field: investigator/methodology/skill
                icon: proficiency-trained
                width: stretch
                label: "_{Skill training (Intelligence-based)}"

              - h5: "_{Feat}"
              - article:
                title: "_{That's Odd}"
                content: "_{When you enter a new location, immediately notice something out of the ordinary, beyond what's obvious.}"
