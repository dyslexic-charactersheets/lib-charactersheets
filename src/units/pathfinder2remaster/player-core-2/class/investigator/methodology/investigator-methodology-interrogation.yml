unit: remaster/investigator/methodology/interrogation
in: remaster/investigator/methodology
group: "_{Player Core 2}"
name: "_{Interrogation}"

inc:
  - set: subclass
    value: "_{Interrogation}"

  - set: investigator-methodology
    value: "_{Interrogation}"
  - set: diplomacy-proficiency
    value: trained

  - at: '@investigator/methodology'
    replace:
      - h4: "_{Interrogation}"
      - hr:
        swash: true
      - layout: 2e
        contents:
          - g:
            contents:
              - p: "_{You can Pursue a Lead while Making an Impression, if you ask about the creature or the conversation's topic.}"

              - action:
                contents:
                  - article:
                    title: "_{Pointed Question}"
                    content: "_{Ask a non-allied creature a question, making a Diplomacy check against its Will DC. The target is then immune for 1 hour.}"
                  - dl:
                    div: true
                    defs:
                      critical_success: "_{Target must answer (not necessarily truthfully); +4 to your Perception DC if it later tries to Lie to you. It's off-guard to your Strikes from Devise a Stratagem until the end of your turn.}"
                      success: "_{As critical success, but +2 to your Perception DC.}"
                      failure: "_{Target can refuse to answer.}"
                      critical_failure: "_{Target can refuse to answer, and its attitude toward you decreases one step.}"

          - g:
            contents:
              - p:
                icon: proficiency-trained
                title: "_{Diplomacy}"

              - h5: "_{Skill Feat}"
              - action: 3
                contents:
                  - article:
                    title: "_{No Cause for Alarm}"
                    content: "_{Make a Diplomacy check against the Will DC of frightened creatures within 10 feet.}"
                  - dl:
                    div: true
                    defs:
                      critical_success: "_{Reduce frightened by 2}"
                      success: "_{Reduce frightened by 1}"
              - spacer:
