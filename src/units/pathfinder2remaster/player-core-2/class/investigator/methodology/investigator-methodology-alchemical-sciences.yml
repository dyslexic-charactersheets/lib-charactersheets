unit: remaster/investigator/methodology/alchemical-sciences
in: remaster/investigator/methodology
group: "_{Player Core 2}"
name: "_{Alchemical Sciences}"

require:
  - unit: option/formula-book

inc:
  - set: subclass
    value: "_{Alchemical Sciences}"

  - set: investigator-methodology
    value: "_{Alchemical Sciences}"
  - set: crafting-proficiency
    value: trained

  - at: '@investigator/methodology'
    replace:
      - h4: "_{Alchemical Sciences}"
      - hr:
        swash: true
      - layout: 2e
        contents:
          - g:
            contents:
              - p: "_{During daily preparations, create versatile vials.}"
              - row:
                contents:
                  - calc:
                    output:
                      field: "##:vials"
                      legend: "_{Versatile Vials}"
                      width: large
                      eq: "%{INT}+%{##:vials/misc}"
                    inputs:
                      - field:
                        ref: INT
                        label: "_{INT}"
                        underlay: "_{INT}"
                      - span: "+"
                      - field: "##:vials/misc"
                        label: "_{Misc}"
                        misc: true
                  - spacer:
                  - field: investigator/alchemical-sciences/vials
                    control: checkgrid
                    max: 10
                    label: "_{Today}"
              - action:
                contents:
                  - article:
                    title: "_{Quick Tincture}"
                    content: "_{Cost 1 versatile vial. Requires an alchemist's toolkit and a free hand. Create a single alchemical elixir or tool of your level or lower from your formula book, without spending its usual cost or needing to Craft. Has the infused trait, but stays potent only until the end of the turn.}"

          - g:
            contents:
              - p:
                icon: proficiency-trained
                title: "_{Crafting}"

              - h5: "_{Skill Feat}"
              - article:
                title: "_{Alchemical Crafting}"
                content: "_{You start with a formula book containing two common 1st-level elixir or tool formulas of your choice, plus those gained here.}"
              - calc:
                output:
                  field: "##:formulas-known"
                  legend: "_{Formulas Known}"
                  width: large
                  eq: "5+%{level}+%{##:formulas-known/misc}"
                inputs:
                  - span: "5 +"
                  - field:
                    ref: level
                    label: "_{Level}"
                  - span: "+"
                  - field: "##:formulas-known/misc"
                    label: "_{Misc}"
                    misc: true
              - p: "_{Each level, learn the formula for one common alchemical elixir or tool of any level you can create.}"

  - at: '@investigator/more'
    add:
      - section: "_{Formulas}"
        contents:
          - list:
            columns: 3
            gutter: small
            merge-bottom: true
            contents:
              - repeat: 27
                reduce: 6
                contents:
                  - row:
                    contents:
                      - field: alchemist-formula-#{i}
                        frame: none
                        width: stretch
                      - field: alchemist-formula-#{i}-level
                        frame: none
                        width: small
