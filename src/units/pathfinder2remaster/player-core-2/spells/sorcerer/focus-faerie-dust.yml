unit: remaster/focus/sorcerer/faerie-dust
name: "_{Faerie Dust}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/faerie-dust
    contents:
      - action: "13"
        contents:
          - article: remaster/focus/sorcerer/faerie-dust
            title: "_{Faerie Dust}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  area: "_{5-foot burst or more}"
                  save: "_{Will}"
              - p: "_{Magical dust makes those in the area easier to trick. Each extra action spent casting adds 5ft to the radius.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Unaffected.}"
                  failure: "_{Can't use reactions; -2 status to Perception checks and Will saves.}"
                  critical_failure: "_{As failure, plus -1 status to Perception checks and Will saves for 1 minute.}"
