unit: remaster/focus/sorcerer/jealous-hex
name: "_{Jealous Hex}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/jealous-hex
    contents:
      - action:
        contents:
          - article: remaster/focus/sorcerer/jealous-hex
            title: "_{Jealous Hex}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 creature}"
                  save: "_{Will}"
                  duration: "_{1 minute}"
              - p: "_{Curses the target's highest attribute: Str (enfeebled), Dex (clumsy), Con (drained), or Int/Wis/Cha (stupefied); target picks on a tie. Will save; new save each of your turns, ending on a success.}"
              - paste: save
                params:
                  critical_success: "_{Unaffected.}"
                  success: "_{Unaffected.}"
                  failure: "_{The condition's value is 1.}"
                  critical_failure: "_{The condition's value is 2.}"
