unit: remaster/focus/sorcerer/elemental-toss
name: "_{Elemental Toss}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/elemental-toss
    contents:
      - action:
        contents:
          - article: remaster/focus/sorcerer/elemental-toss
            title: "_{Elemental Toss}"
            cat: "_{Focus 1}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 creature}"
                  save: "_{AC}"
              - p: "_{Fling elemental matter at your foe. Ranged spell attack roll: damage on a success, double on a critical success. Damage type matches your influence (e.g. slashing for air, fire for fire); has your element's trait.}"
              - calc:
                output:
                  field: "##:elemental-toss/damage"
                  legend: "_{Damage}"
                  width: large
                  suffix: "_{d8}"
                  icon: d8
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
