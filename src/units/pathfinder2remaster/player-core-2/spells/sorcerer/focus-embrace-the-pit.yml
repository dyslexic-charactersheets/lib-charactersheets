unit: remaster/focus/sorcerer/embrace-the-pit
name: "_{Embrace the Pit}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/embrace-the-pit
    contents:
      - action:
        contents:
          - article: remaster/focus/sorcerer/embrace-the-pit
            title: "_{Embrace the Pit}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Devil horns grow from your skull; your skin takes on features of your bloodline's devil.}"
              - calc:
                output:
                  field: "##:embrace-the-pit/resistance-fire-poison"
                  legend: "_{Fire /\nPoison\nResistance}"
                  width: large
                  eq: "floor((%{focus-rank}-3)/2)*5+5"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
              - calc:
                output:
                  field: "##:embrace-the-pit/resistance-physical"
                  legend: "_{Physical\nResistance\n(Except Silver)}"
                  width: large
                  eq: "floor((%{focus-rank}-3)/2)*2+1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
