unit: remaster/focus/sorcerer/arcane-countermeasure
name: "_{Arcane Countermeasure}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/arcane-countermeasure
    contents:
      - action: reaction
        contents:
          - article: remaster/focus/sorcerer/arcane-countermeasure
            title: "_{Arcane Countermeasure}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  trigger: "_{A creature within range that you can see Casts a Spell.}"
                  range: "_{120ft}"
                  target: "_{the spell cast by the triggering creature}"
              - p: "_{Reduce the target spell's rank by 1 (not below its minimum) and give its targets +2 status to saves/skill checks/AC/DC against it; the +2 applies even if the rank can't be reduced.}"
