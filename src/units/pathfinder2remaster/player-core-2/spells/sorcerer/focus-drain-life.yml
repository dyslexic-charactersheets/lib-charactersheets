unit: remaster/focus/sorcerer/drain-life
name: "_{Drain Life}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/drain-life
    contents:
      - action:
        contents:
          - article: remaster/focus/sorcerer/drain-life
            title: "_{Drain Life}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  range: "_{30ft}"
                  target: "_{1 living creature}"
                  save: "_{basic Fortitude}"
              - p: "_{Void damage (basic Fortitude); gain temp HP equal to damage dealt (or the target's remaining HP if less), lasting 1 minute.}"
              - calc:
                output:
                  field: "##:drain-life/damage"
                  legend: "_{Void\nDamage}"
                  width: large
                  suffix: "_{d4}"
                  icon: d4
                  eq: "%{focus-rank}"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
