unit: remaster/focus/sorcerer/elemental-motion
name: "_{Elemental Motion}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/elemental-motion
    contents:
      - action: 2
        contents:
          - article: remaster/focus/sorcerer/elemental-motion
            title: "_{Elemental Motion}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  duration: "_{1 minute}"
              - p: "_{Your element propels you, improving your Speed by type. Has your element's trait.}"
              - ul:
                contents:
                  - li: "_{Air/Fire: fly Speed equal to your Speed.}"
                  - li: "_{Earth/Metal: burrow Speed 10ft.}"
                  - li: "_{Water: swim Speed equal to your Speed; breathe underwater.}"
                  - li: "_{Wood: climb Speed equal to your Speed.}"
              - p: "_{Heightened (6th): +10ft status bonus to your Speeds.}"
              - p: "_{Heightened (9th): the status bonus increases to +20 feet.}"
