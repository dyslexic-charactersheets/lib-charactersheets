unit: remaster/focus/sorcerer/hellfire-plume
name: "_{Hellfire Plume}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/hellfire-plume
    contents:
      - action: 2
        contents:
          - article: remaster/focus/sorcerer/hellfire-plume
            title: "_{Hellfire Plume}"
            cat: "_{Focus 5}"
            contents:
              - dl:
                  range: "_{60ft}"
                  area: "_{10-foot radius, 60-foot-tall cylinder}"
                  save: "_{basic Reflex}"
              - p: "_{A plume of hellfire erupts from below, dealing fire and spirit damage.}"
              - calc:
                output:
                  field: "##:hellfire-plume/damage"
                  legend: "_{Fire /\nSpirit Damage\n(Each)}"
                  width: large
                  suffix: "_{d6 each}"
                  icon: d6
                  eq: "%{focus-rank}-1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
