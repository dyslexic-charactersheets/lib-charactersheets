unit: remaster/focus/sorcerer/dragon-breath
name: "_{Dragon Breath}"
group: "_{Player Core 2}"

inc:
  - copy: remaster/focus/sorcerer/dragon-breath
    contents:
      - action: 2
        contents:
          - article: remaster/focus/sorcerer/dragon-breath
            title: "_{Dragon Breath}"
            cat: "_{Focus 3}"
            contents:
              - dl:
                  area: "_{30-foot cone}"
                  save: "_{basic Reflex}"
              - p: "_{Spew energy from your mouth: damage type is tradition-based (arcane force, divine spirit, occult mental, or primal fire).}"
              - calc:
                output:
                  field: "##:dragon-breath/damage"
                  legend: "_{Damage}"
                  width: large
                  suffix: "_{d6}"
                  icon: d6
                  eq: "(%{focus-rank}*2)-1"
                inputs:
                  - field:
                    ref: focus-rank
                    label: "_{Focus Level}"
