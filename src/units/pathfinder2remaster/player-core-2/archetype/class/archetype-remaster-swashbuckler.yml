unit: archetype/remaster/swashbuckler
in: archetype
group: "_{Player Core 2}"
name: "_{Swashbuckler}"
multiclass: true

form:
  - select: remaster/swashbuckler/style
    name: "_{Swashbuckler's Style}"
    max: 1

require:
  - unit: defs/archetypes
  - deny: archetype/swashbuckler

inc:
  - set: swashbuckler-class-dc-proficiency
    value: trained

  - at: '@archetypes'
    add:
      - name: "_{Swashbuckler}"
        num-feats: 3

  - at: '@reference/action-traits'
    add:
      - bravado
      - finisher
      - flourish

  - at: '@reference/weapon-traits'
    add:
      - deadly
      - thrown

  - at: '@pages'
    add:
      - page: archetype-swashbuckler
        name: "_{Swashbuckler}"
        order: 26
        flex: true
        half: true
        contents:
          - layout: 2e
            contents:
              - g:
                contents:
                  - g:
                    flex: tiny
                    contents:
                      - class-icon: swashbuckler
                      - class-name: "_{Swashbuckler}"

                  - section: "_{Dedication}"
                    contents:
                      - p: "_{Trained in Acrobatics or your style's skill}"
                        icon: proficiency-trained

                      - hr:

                      - paste: class-dc
                        params:
                          id: swashbuckler-class-dc
                          legend: "_{Swashbuckler\nClass DC}"
                          misc: false

                      - hr:

                      - row:
                        contents:
                          - spacer:
                          - layout: indent-l
                            contents:
                              - field: panache
                                control: checkbox
                              - h6: "_{Panache}"
                          - spacer:
                          
                      - list:
                        hr: true
                        contents:
                          - g:
                            contents:
                              - h6: "_{Gain panache when...}"
                              - ul:
                                contents:
                                  - li: "_{You successfully [action]Tumble Through[/action] an enemy's space}"
                                  - zone: '@swashbuckler/gain-panache'
                                    contents:
                                      - li:
                                        contents:
                                          - field: gain-panache
                                            width: stretch
                                            frame: none
                                  - li: "_{You succeed at a particularly daring check that the GM gives [trait]bravado[/trait]}"
                          - g:
                            contents:
                              - h6: "_{Spend panache to...}"
                              - ul:
                                contents:
                                  - li: "_{Make a [trait]finisher[/trait]}"

                      - hr:
                        light: true

                      - h6: "_{Stylish Combatant}"
                      - value-block: "+1"
                        content: "_{To skill checks with [trait]bravado[/trait] in a combat encounter}"
                      - value-block: "+_{5ft}"
                        width: medium
                        content: "_{Speed while you have panache}"

                  - section: "_{Swashbuckler's Style}"
                    primary: true
                    contents:
                      - zone: '@swashbuckler/style-min'
                        contents:
                          - field: swashbuckler-style
                            frame: none
                            size: huge
                            width: stretch
                            merge-bottom: true
                          - hr:
                            swash: true
                          - article: "##:swashbucklers-style"
                            lines: 9

                  - tail:
                  - spacer:

              - g:
                contents:

                  - section: "_{Archetype Feats}"
                    contents:
                      - article: "##:finishing-precision"
                        title: "_{Finishing Precision}"
                        cat: "_{Feat} 4"
                        merge-bottom: false
                        contents:
                          - selectable: 'finishing-precision'
                            contents:
                              - p: "_{When you [action]Strike[/action] with an [trait]agile[/trait] or [trait]finesse[/trait] melee weapon or unarmed attack, deal additional precision damage.}"
                              - row:
                                contents:
                                  - value-block: "+1"
                                    content: "_{Precision damage}"
                                  - spacer:
                                  - field: "##:finishing-precision/finisher-damage"
                                    control: value
                                    value: "_{1d6}"
                                    icon: d6
                                    frame: none
                                  - p: "_{On a [trait]finisher[/trait]}"

                              - action:
                                contents:
                                  - flags:
                                      - "_{Finisher}"
                                  - p:
                                    title: "_{Basic Finisher}"
                                    content: "_{Make a [action]Strike[/action] with a qualifying weapon.}"
                                
                      - article: "##:swashbucklers-riposte"
                        title: "_{Swashbuckler's Riposte}"
                        cat: "_{Feat} 6"
                        merge-bottom: false
                        contents:
                          - selectable: 'swashbucklers-riposte'
                            contents:
                              - action: reaction
                                contents:
                                  - flags:
                                      - "_{Bravado}"
                                  - dl:
                                    defs:
                                      trigger: "_{An enemy in your reach critically fails a [action]Strike[/action] against you.}"
                                  - p: "_{Make a melee [action]Strike[/action] or [action]Disarm[/action] attempt against the triggering enemy.}"

                      - article: "##:swashbucklers-speed"
                        title: "_{Swashbuckler's Speed}"
                        cat: "_{Feat} 8"
                        merge-bottom: false
                        contents:
                          - selectable: 'swashbucklers-speed'
                            contents:
                              - row:
                                contents:
                                  - value-block: "+_{5ft}"
                                    width: medium
                                    content: "_{Speed}"
                                  - value-block: "+_{10ft}"
                                    width: medium
                                    content: "_{Speed while you have panache}"
                                
                      - article: "##:evasiveness"
                        title: "_{Evasiveness}"
                        cat: "_{Feat} 12"
                        merge-bottom: false
                        contents:
                          - selectable: 'evasiveness'
                            contents:
                              - row:
                                contents:
                                  - icon: proficiency-expert
                                  - span: "&rarr;"
                                  - icon: proficiency-master
                                  - p: "_{Reflex saves}"

                  - section: "_{Flair}"
                    mark: swashbuckler
                    contents:
                      - paste: archetype-feats
                        params:
                          id: swashbuckler-feats
                          class-level: "_{Swashbuckler\nLevel}"
                          basic-title: "_{Basic Flair}"
                          advanced-title: "_{Advanced Flair}"
                          lines: 2
                          num: 2

                  - tail:
