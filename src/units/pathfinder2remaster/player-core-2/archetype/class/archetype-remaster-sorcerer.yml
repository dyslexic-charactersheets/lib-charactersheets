unit: archetype/remaster/sorcerer
in: archetype
group: "_{Player Core 2}"
name: "_{Sorcerer}"
multiclass: true

require:
  - unit: defs/archetypes
  - deny: archetype/sorcerer

inc:
  - at: '@archetypes'
    add:
      - name: "_{Sorcerer}"
        num-feats: 3

  - at: '@pages'
    add:
      - page: archetype-sorcerer
        name: "_{Sorcerer}"
        order: 26
        flex: true
        half: true
        contents:
          - layout: 2e
            contents:
              - g:
                contents:
                  - g:
                    flex: tiny
                    contents:
                      - class-icon: sorcerer
                      - class-name: "_{Sorcerer}"

                  - section: "_{Dedication}"
                    contents:
                      - p: "_{Trained in your bloodline's skills}"
                        icon: proficiency-trained

                  - section: "_{Bloodline}"
                    primary: true
                    contents:
                      - zone: '@sorcerer/bloodline/title'
                        contents:
                          - field: sorcerer-bloodline
                            size: huge
                            width: stretch
                            frame: none
                            merge-bottom: true
                      - hr:
                        swash: true
                      - field: sorcerer-bloodline-tradition
                        icon: proficiency-trained
                        width: stretch
                        label: "_{Tradition}"
                      - h5: "_{Bloodline Skills}"
                      - field: sorcerer-bloodline-skills
                        width: stretch
                        frame: none
                        merge-bottom: true
                      - hr:
                        light: true
                      - article: "##:basic-bloodline-spell"
                        title: "_{Basic Bloodline Spell}"
                        cat: "_{Feat} 4"
                        contents:
                          - selectable: 'basic-bloodline-spell'
                            contents:
                              - paste: focus
                                contents:
                                  - field: sorcerer-bloodline-spell-initial
                                    label: "_{Initial Bloodline Spell}"
                                    width: stretch

                  - section: "_{Blood Potency}"
                    mark: sorcerer
                    contents:
                      - paste: archetype-feats
                        params:
                          id: sorcerer-feats
                          class-level: "_{Sorcerer\nLevel}"
                          basic-title: "_{Basic Blood Potency}"
                          advanced-title: "_{Advanced Blood Potency}"
                          num: 2

                  - tail:

              - g:
                contents:
                  - paste: archetype-spellcasting
                    params:
                      style: spontaneous
                      attribute: "CHA"
                      attribute-name: "_{CHA}"
                      breadth: "_{Bloodline Breadth}"

                  - tail:
