unit: archetype/remaster/champion
in: archetype
group: "_{Player Core 2}"
name: "_{Champion}"
multiclass: true

require:
  - unit: defs/archetypes
  - deny: archetype/champion

inc:
  - set: religion-proficiency
    value: trained
  - set: champion-class-dc-proficiency
    value: trained

  - at: '@archetypes'
    add:
      - name: "_{Champion}"
        num-feats: 3

  - at: '@pages'
    add:
      - page: archetype-champion
        name: "_{Champion}"
        order: 26
        flex: true
        half: true
        contents:
          - layout: 2e
            contents:
              - g:
                contents:
                  - g:
                    flex: tiny
                    contents:
                      - class-icon: champion
                      - zone: '@champion/class-name'
                        contents:
                          - class-name: ""
                            suffix: "_{Champion of}"
                      - field: cleric-deity
                        label: "_{Deity}"
                        width: stretch
                        align: center
                      - row: center
                        contents:
                          - field: champion-holy
                            frame: left
                            control: checkbox
                            label: "_{Holy}"
                          - icon: good
                          - span: "&nbsp; &nbsp; &nbsp;"
                          - icon: evil
                          - field: champion-unholy
                            frame: right
                            control: checkbox
                            label: "_{Unholy}"

                  - section: "_{Dedication}"
                    contents:
                      - p: "_{Trained in Religion and your deity's skill}"
                        icon: proficiency-trained
                      - p: "_{Trained in light and medium armour}"
                        icon: proficiency-trained

                      - hr:

                      - paste: class-dc
                        params:
                          id: champion-class-dc
                          legend: "_{Champion\nClass DC}"
                          misc: false

                  - section: "_{Devotion}"
                    mark: champion
                    contents:
                      - paste: archetype-feats
                        params:
                          id: champion-feats
                          num: 3
                          class-level: "_{Champion\nLevel}"
                          basic-title: "_{Basic Devotion}"
                          advanced-title: "_{Advanced Devotion}"
                          lines: 3

                  - tail:

              - g:
                contents:
                  - section: "_{Cause}"
                    primary: true
                    contents:
                      - zone: '@champion/cause/title'
                        contents:
                          - field: champion-cause
                            size: huge
                            width: stretch
                            frame: none
                            merge-bottom: true
                      - hr:
                        swash: true
                      - g:
                        contents:
                          - paste: anathema
                            params:
                              id: edicts
                              title: "_{Edicts}"
                              lines: 3
                              merge-bottom: false
                          - paste: anathema
                            params:
                              lines: 3
                              merge-bottom: false
                          - p: "_{If you violate your edicts or anathema, you lose your Focus Points and blessing of the devoted until you demonstrate repentance.}"

                  - section: "_{Archetype Feats}"
                    contents:
                      - paste: archetype-resiliency-feat
                        params:
                          class: champion
                          title: "_{Champion Resiliency}"

                      - article: "##:devout-magic"
                        title: "_{Devout Magic}"
                        cat: "_{Feat} 4"
                        merge-bottom: false
                        contents:
                          - selectable: 'devout-magic'
                            contents:
                              - paste: focus
                                contents:
                                  - field: "##:devout-magic/devotion-spell"
                                    label: "_{Devotion Spell}"
                                    width: stretch
                          - paste: spell-attack
                            params:
                              id: spell-attack
                              legend: "_{Spell\nAttack}"
                              attribute: CHA
                              misc: false
                              proficiency: trained
                          - paste: spell-dc
                            params:
                              id: spell-save-dc
                              legend: "_{Spell\nSave DC}"
                              attribute: CHA
                              misc: false
                              proficiency: trained

                      - article: "##:champions-reaction"
                        title: "_{Champion's Reaction}"
                        cat: "_{Feat} 6"
                        contents:
                          - selectable: 'champions-reaction'
                            contents:
                              - article: "##:champions-reaction/reaction"
                                merge-bottom: false
                                action: reaction
                                lines: 2

                      - article: "##:devout-blessing"
                        title: "_{Devout Blessing}"
                        cat: "_{Feat} 6"
                        contents:
                          - selectable: 'devout-blessing'
                            contents:
                              - field: champion-blessing
                                width: stretch
                                frame: none
                                control: p
                                lines: 3
                                with-title: false
                                merge-bottom: true

                  - tail:
