unit: archetype/remaster/barbarian
in: archetype
group: "_{Player Core 2}"
name: "_{Barbarian}"
multiclass: true

require:
  - unit: defs/archetypes
  - deny: archetype/barbarian

inc:
  - set: athletics-proficiency
    value: trained
  - set: barbarian-class-dc-proficiency
    value: trained

  - at: '@archetypes'
    add:
      - name: "_{Barbarian}"
        num-feats: 3

  - at: '@pages'
    add:
      - page: archetype-barbarian
        name: "_{Barbarian}"
        order: 26
        flex: true
        half: true
        contents:
          - layout: 2e
            contents:
              - g:
                contents:
                  - g:
                    flex: tiny
                    contents:
                      - class-icon: barbarian
                      - class-name: "_{Barbarian}"

                  - section: "_{Dedication}"
                    contents:
                      - p: "_{Trained in Athletics}"
                        icon: proficiency-trained

                      - hr:

                      - paste: class-dc
                        params:
                          id: barbarian-class-dc
                          legend: "_{Barbarian\nClass DC}"
                          misc: false

                      - action:
                        contents:
                          - row:
                            contents:
                              - g:
                                contents:
                                  - h5: "_{[b]Rage![/b]}"
                                    size: large
                                  - flags:
                                      - "_{Concentrate}"
                                      - "_{Emotion}"
                                      - "_{Mental}"
                                  - p: "_{1 minute, until combat ends, or until you fall unconscious.}"
                              - field: rage-current
                                legend: "_{Duration}"
                                control: checkgrid
                                depth: 3
                                max: 10
                              - span: "&nbsp;"

                      - hr:
                        light: true

                      - row:
                        contents:
                          - value-block: "-1"
                            content: "_{AC}"

                          - spacer:

                          - vr:
                          - value-block: "+2"
                            content: "_{Damage to melee Strikes}"

                          - spacer:

                      - p:
                        title: "_{Agile}"
                        content: "_{If using an agile weapon or unarmed attack, [b]Rage![/b] damage bonus is halved.}"

                      - hr:
                        light: true

                      - calc:
                        output:
                          field: barbarian-rage-temp-hp
                          legend: "_{Temporary\nHit Points}"
                          suffix: hp
                          width: huge
                          temp: true
                          eq: "%{CON}+%{level}"
                        inputs:
                          - field:
                            ref: CON
                            underlay: "_{CON}"
                            label: "_{CON}"
                          - span: "+"
                          - field:
                            ref: level
                            label: "_{Level}"

                      - hr:
                        light: true

                      - p:
                        title: "_{While Raging}:"
                        content: "_{Can't use [trait]Concentrate[/trait] actions unless they also have the [trait]Rage[/trait] trait. You can Seek while raging.}"
                      - p:
                        title: "_{After Raging}:"
                        content: "_{Lose your temporary hit points. Temporary hit points gained from [b]Rage![/b] are on cooldown for 1 minute.}"
                        pad: true

                  - section: "_{Instinct}"
                    primary: true
                    contents:
                      - field: barbarian-instinct
                        frame: none
                        size: gargantuan
                        width: stretch
                        align: left
                        merge-bottom: true
                      - p: "_{If your instinct has anathema, you're bound by them.}"
                        optional: true
                      - hr:
                        swash: true
                      - article: "##:instinct-ability"
                        title: "_{Instinct Ability}"
                        cat: "_{Feat} 6"
                        contents:
                          - selectable: 'barbarian-instinct-ability'
                            contents:
                              - field: 'barbarian-instinct-ability/details'
                                control: p
                                lines: 3
                                with-title: false

                  - tail:

              - g:
                contents:

                  - section: "_{Archetype Feats}"
                    contents:
                      - paste: archetype-resiliency-feat
                        params:
                          class: barbarian
                          title: "_{Barbarian Resiliency}"
                      
                      - article: "##:juggernauts-fortitude"
                        title: "_{Juggernaut's Fortitude}"
                        cat: "_{Feat} 12"
                        contents:
                          - selectable: 'barbarian-juggernauts-fortitude'
                            contents:
                              - row:
                                contents:
                                  - icon: proficiency-expert
                                  - span: "&rarr;"
                                  - icon: proficiency-master
                                  - span: "_{Fortitude saves}"

                  - section: "_{Fury}"
                    mark: barbarian
                    contents:
                      - paste: archetype-feats
                        params:
                          id: barbarian-feats
                          class-level: "_{Barbarian\nLevel}"
                          basic-title: "_{Basic Fury}"
                          advanced-title: "_{Advanced Fury}"
                          lines: 3

                  - tail:
