unit: archetype/remaster/monk
in: archetype
group: "_{Player Core 2}"
name: "_{Monk}"
multiclass: true

require:
  - unit: defs/archetypes
  - deny: archetype/monk

inc:
  - set: unarmed-attack-proficiency
    value: trained
  - set: monk-class-dc-proficiency
    value: trained

  - at: '@archetypes'
    add:
      - name: "_{Monk}"
        num-feats: 3

  - at: '@reference/action-traits'
    add:
      - flourish

  - at: '@pages'
    add:
      - page: archetype-monk
        name: "_{Monk}"
        order: 26
        flex: true
        half: true
        contents:
          - layout: 2e
            contents:
              - g:
                contents:
                  - g:
                    flex: tiny
                    contents:
                      - class-icon: monk
                      - class-name: "_{Monk}"

                  - section: "_{Dedication}"
                    contents:
                      - p: "_{Trained in unarmed attacks}"
                        icon: proficiency-trained
                      - p: "_{Trained in Acrobatics or Athletics}"
                        icon: proficiency-trained

                      - hr:

                      - paste: class-dc
                        params:
                          id: monk-class-dc
                          legend: "_{Monk\nClass DC}"
                          misc: false

                      - hr:

                      - h5: "_{Powerful Fist}"
                      - row:
                        contents:
                          - field: "##:powerful-fist/damage"
                            control: value
                            value: "_{1d6}"
                            icon: d6
                            frame: none
                          - p: "_{Unarmed damage with your fist.}"
                      - p: "_{Don't take the -2 penalty when making a lethal attack with a [trait]nonlethal[/trait] unarmed attack.}"

                  - section: "_{Archetype Feats}"
                    contents:
                      - paste: archetype-resiliency-feat
                        params:
                          class: monk
                          title: "_{Monk Resiliency}"

                      - article: "##:monk-moves"
                        title: "_{Monk Moves}"
                        cat: "_{Feat} 8"
                        merge-bottom: false
                        contents:
                          - selectable: 'monk-moves'
                            contents:
                              - row:
                                contents:
                                  - span: "+_{10ft}"
                                  - p: "_{Speed when unarmoured}"

                      - article: "##:monks-flurry"
                        title: "_{Monk's Flurry}"
                        cat: "_{Feat} 10"
                        merge-bottom: false
                        contents:
                          - selectable: 'monks-flurry'
                            contents:
                              - action: 1
                                contents:
                                  - flags:
                                      - "_{Flourish}"
                                  - p: "_{Make two unarmed [action]Strikes[/action]. If both hit the same creature, combine their damage for resistances and weaknesses.}"
                                  - dl:
                                    defs:
                                      cooldown: "_{1d4 rounds}"

                      - article: "##:perfections-path"
                        title: "_{Perfection's Path}"
                        cat: "_{Feat} 12"
                        merge-bottom: false
                        contents:
                          - selectable: 'perfections-path'
                            contents:
                              - row:
                                contents:
                                  - icon: proficiency-expert
                                  - span: "&rarr;"
                                  - icon: proficiency-master
                                  - p: "_{One saving throw}"

                  - tail:
                  - spacer:

              - g:
                contents:

                  - section: "_{Kata}"
                    mark: monk
                    contents:
                      - paste: archetype-feats
                        params:
                          id: monk-feats
                          class-level: "_{Monk\nLevel}"
                          basic-title: "_{Basic Kata}"
                          advanced-title: "_{Advanced Kata}"
                          num: 7

                  - tail:
