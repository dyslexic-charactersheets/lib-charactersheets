unit: font/merriweather-black
name: "Merriweather Black Font"
group: "_{Common}"

require:
  - with: script/latin
    unit: font/merriweather-black/latin
  - with: script/euro
    unit: font/merriweather-black/euro
  - with: script/cyrillic
    unit: font/merriweather-black/cyrillic