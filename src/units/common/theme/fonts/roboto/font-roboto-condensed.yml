unit: font/roboto-condensed
name: "Roboto Condensed Font"
group: "_{Common}"

require:
  - with: script/latin
    unit: font/roboto-condensed/latin
  - with: script/euro
    unit: font/roboto-condensed/euro
  - with: script/greek
    unit: font/roboto-condensed/greek
  - with: script/cyrillic
    unit: font/roboto-condensed/cyrillic