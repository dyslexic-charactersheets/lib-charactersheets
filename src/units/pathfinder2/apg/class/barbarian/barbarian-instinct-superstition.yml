unit: barbarian/instinct/apg/superstition
in: barbarian/instinct
group: "_{Advanced Player's Guide}"
name: "_{Superstition}"

inc:
  - set: subclass
    value: "_{Superstition}"

  - set: barbarian-instinct
    value: "_{Superstition}"

  - at: '@barbarian/instinct'
    replace:
      - g:
        contents:
          - h4: "_{Superstition}"
          - hr:
            swash: true
          # APG p108 flavor line
          - p: "_{A deep distrust of magic drives you to forgo and counter the metaphysical nonsense of spellcasters.}"
          - h5: "_{Anathema}"
          - ul:
            contents:
              # APG p108 anathema additional info
              - li: "_{Willingly accepting the effects of magic spells (including from scrolls, wands, and the like), even from your allies.}"
          - paste: barbarian-anathema-consequence

  - at: '@barbarian/instinct-ability'
    replace:
      - g:
        contents:

          - h5: "_{Superstitious Resilience}"
          - field: "##:superstitious-resilience/save-bonus"
            label: "_{[b]Rage![/b] Status Bonus to Saves vs. Magic}"
            frame: right
            control: value
            width: large
            value: "+2"
          - field: barbarian-superstition-damage-bonus-spellcaster
            label: "_{...vs. witnessed spellcasters}"
            frame: right
            control: value
            width: large
            value: "+4"
          - p: "_{When you [b]Rage![/b] (once every 10 minutes), regain Hit Points equal to the temporary HP you gained from the [b]Rage![/b] action.}"

  - at: '@barbarian/specialisation-ability'
    replace:
      - level: 7
        contents:
          - h5: "_{Weapon Specialisation}"
          - field: barbarian-superstition-damage-bonus-spellcaster
            label: "_{...vs. witnessed spellcasters}"
            frame: right
            control: value
            width: large
            value: "+8"

  - at: '@barbarian/specialisation-ability/greater'
    replace:
      - level: 15
        contents:
          - field: barbarian-superstition-damage-bonus-greater
            label: "_{[b]Rage![/b] Damage Bonus}"
            frame: right
            control: value
            width: large
            value: "+8"
          - field: barbarian-superstition-damage-bonus-greater-spellcaster
            label: "_{...vs. witnessed spellcasters}"
            frame: right
            control: value
            width: large
            value: "+12"

  - at: '@barbarian/raging-resistance'
    replace:
      - row:
        contents:
          - field: barbarian/instinct/apg/superstition/raging-resistance/tradition1
            frame: left
            label: "<span class='size_small'>_{Arcane}</span>"
            control: radio
            value: arcane
          - label: "_{or}"
          - field: barbarian/instinct/apg/superstition/raging-resistance/tradition1
            frame: right
            label: "<span class='size_small'>_{Divine}</span>"
            control: radio
            value: divine
          - spacer:
          - field: barbarian/instinct/apg/superstition/raging-resistance/tradition2
            frame: left
            label: "<span class='size_small'>_{Primal}</span>"
            control: radio
            value: primal
          - label: "_{or}"
          - field: barbarian/instinct/apg/superstition/raging-resistance/tradition2
            frame: right
            label: "<span class='size_small'>_{Occult}</span>"
            control: radio
            value: occult

