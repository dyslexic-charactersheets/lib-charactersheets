unit: barbarian/instinct/giant
in: barbarian/instinct
group: "_{Core Rulebook}"
name: "_{Giant}"

inc:
  - set: barbarian-instinct
    value: "_{Giant}"

  - set: barbarian-rage-damage-bonus
    value: 6

  - at: '@barbarian/instinct'
    replace:
      - g:
        contents:
          - h4: "_{Giant}"
          - hr:
            swash: true
          - h5: "_{Anathema}"
          - ul:
            contents:
              - li: "_{Failing to face a personal challenge of strength}"
          - paste: barbarian-anathema-consequence

  - at: '@barbarian/instinct-ability'
    replace:
      - g:
        contents:
          - h5: "_{Titan Mauler}"
          # CRB p87: I believe this was incorrect because Tiny creatures aren't specified to be able to use Large weapons
          - p: "_{You can use a weapon built for a Large creature if you're Small or Medium (both normally and while raging); otherwise, you can use one built for a creature one size larger than you.}"
          - row:
            contents:
              - field: "##:titan-mauler/damage"
                label: "_{[b]Rage![/b] Damage Bonus}"
                frame: right
                control: value
                width: large
                value: "+6"
              - field: "##:titan-mauler/clumsy"
                label: "_{Clumsy}"
                value: 1
                control: span
          # CRB p87: add a mention of this restriction
          - p: "_{This applies only while wielding the larger weapon; you can't remove or ignore the clumsy condition while wielding it.}"
            optional: true

  - at: '@barbarian/specialisation-ability'
    replace:
      - level: 7
        contents:
          - h5: "_{Weapon Specialisation}"
          - field: "##:rage/damage"
            label: "_{[b]Rage![/b] Damage Bonus}"
            # border: full
            frame: right
            control: value
            width: large
            value: "+10"

  - at: '@barbarian/specialisation-ability/greater'
    replace:
      - level: 15
        contents:
          - h5: "_{Greater Weapon Specialisation}"
          - field: "##:rage/greater/damage"
            label: "_{[b]Rage![/b] Damage Bonus}"
            # border: full
            frame: right
            control: value
            width: large
            value: "+18"

  - at: '@barbarian/raging-resistance'
    replace:
      - layout: 2e
        contents:
          - field: barbarian-raging-resistance-bludgeoning
            control: checkbox
            value: true
            frame: right
            label: "_{Bludgeoning}"
          - field: barbarian-raging-resistance-cold
            control: checkbox
            frame: right
            label: "_{Cold}"
          - field: barbarian-raging-resistance-electricity
            control: checkbox
            frame: right
            label: "_{Electricity}"
          - field: barbarian-raging-resistance-fire
            control: checkbox
            frame: right
            label: "_{Fire}"
