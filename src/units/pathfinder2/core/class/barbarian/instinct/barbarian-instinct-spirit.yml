unit: barbarian/instinct/spirit
in: barbarian/instinct
group: "_{Core Rulebook}"
name: "_{Spirit}"

inc:
  - set: barbarian-instinct
    value: "_{Spirit}"

  - at: '@barbarian/instinct'
    replace:
      - g:
        contents:
          - h4: "_{Spirit}"
          - hr:
            swash: true
          # CRB p87 intro flavor text
          - p: "_{Your rage takes the form of a spiritual possession—whether you're emotionally sensitive to spirits, worship ancestors, or are haunted by a specter.}"
          - h5: "_{Anathema}"
          - ul:
            contents:
              - li: "_{Disrespecting corpses or spirits (defending yourself against undead creatures is not).}"
          - paste: barbarian-anathema-consequence

  - at: '@barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@archetype/barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@barbarian/specialisation-ability'
    replace:
      - nothing:

  - at: '@barbarian/specialisation-ability/greater'
    replace:
      - nothing:

  - at: '@barbarian/left'
    add:
      - section: "[b]_{Spirit Rage!}[/b]"
        id: spirit-rage
        contents:
          - list:
            hr: true
            contents:
              - g:
                contents:
                  # CRB p87-88 Spirit Rage instinct ability, may clarify later
                  - p: "_{While raging, you can increase your additional damage from [b]Rage![/b] from 2 to 3 and change its damage type to negative or positive, instead of the damage type for your weapon or unarmed attack (choose each time you [b]Rage![/b]). If you choose to deal negative or positive damage, your weapon or unarmed attack gains the effect of the ghost touch rune, and your [b]Rage![/b] action gains the divine trait, plus negative or positive, as appropriate.}"
                  - indent: left
                    contents:
                      - field: barbarian-spirit-rage-damage-bonus
                        label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                        # border: full
                        frame: right
                        control: value
                        width: large
                        value: "+3"
              - level: 7
                contents:
                  - h5: "_{Weapon Specialisation}"
                  - field: barbarian-spirit-rage-damage-bonus-spec
                    label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                    # border: full
                    frame: right
                    control: value
                    width: large
                    value: "+7"
              - level: 15
                contents:
                  - h5: "_{Greater Weapon Specialisation}"
                  - field: barbarian-spirit-rage-bonus-greater
                    label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                    # border: full
                    frame: right
                    control: value
                    width: large
                    value: "+13"

  - at: '@archetype/barbarian/rage-power'
    add:
      - zone: '@barbarian/left'

  - at: '@barbarian/raging-resistance'
    replace:
      - layout: 2e
        contents:
          - field: barbarian-raging-resistance-negative
            label: "_{Negative energy}"
            width: stretch
            control: checkbox
            value: true
            frame: right
          - field: barbarian-raging-resistance-undead
            label: "_{Damage by undead creatures}"
            width: stretch
            control: checkbox
            value: true
            frame: right
