unit: barbarian/instinct/spirit
in: barbarian/instinct
group: "_{Core Rulebook}"
name: "_{Spirit}"

inc:
  - set: barbarian-instinct
    value: "_{Spirit}"

  - at: '@barbarian/instinct'
    replace:
      - g:
        contents:
          - h4: "_{Spirit}"
          - hr:
            swash: true
          - h5: "_{Anathema}"
          - ul:
            contents:
              - li: "_{Disrespecting corpses or spirits (defending yourself against undead creatures is not).}"
          - paste: barbarian-anathema-consequence

  - at: '@barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@archetype/barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@barbarian/specialisation-ability'
    replace:
      - level: 7
        contents:
          - h5: "_{Weapon Specialisation}"
          - field: barbarian-spirit-rage-damage-bonus-spec
            label: "_{[b]Spirit Rage![/b] Damage Bonus}"
            # border: full
            frame: right
            control: value
            width: large
            value: "+7"

  - at: '@barbarian/specialisation-ability/greater'
    replace:
      - level: 15
        contents:
          - h5: "_{Greater Weapon Specialisation}"
          - field: barbarian-spirit-rage-bonus-greater
            label: "_{[b]Spirit Rage![/b] Damage Bonus}"
            # border: full
            frame: right
            control: value
            width: large
            value: "+13"

  - at: '@barbarian/left'
    add:
      - section: "[b]_{Spirit Rage!}[/b]"
        id: spirit-rage
        contents:
          - list:
            hr: true
            contents:
              - g:
                contents:
                  - p: "_{[b]Rage![/b] to choose to make your [b]Rage![/b] attack negative or positive and its bonus +3 damage. Add the ghost touch rune effect and <span class='flag'>Divine</span> to it.}"
                  - indent: left
                    contents:
                      - field: barbarian-spirit-rage-damage-bonus
                        label: "_{[b]Spirit Rage![/b] Damage Bonus}"
                        # border: full
                        frame: right
                        control: value
                        width: large
                        value: "+3"

  - at: '@archetype/barbarian/rage-power'
    add:
      - zone: '@barbarian/left'

  - at: '@barbarian/raging-resistance'
    replace:
      - layout: 2e
        contents:
          - field: barbarian-raging-resistance-negative
            label: "_{Negative damage}"
            width: stretch
            control: checkbox
            value: true
            frame: right
          - field: barbarian-raging-resistance-undead
            label: "_{Undead damage}"
            width: stretch
            control: checkbox
            value: true
            frame: right
