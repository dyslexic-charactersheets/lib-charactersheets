unit: barbarian/instinct/dragon
in: barbarian/instinct
group: "_{Core Rulebook}"
name: "_{Dragon}"

inc:
  - set: barbarian-instinct
    value: "_{Dragon}"

  - at: '@barbarian/instinct'
    replace:
      - g:
        contents:
          - h4: "_{Dragon}"
          - hr:
            swash: true
          # CRB p86 intro flavor text
          - p: "_{You summon the fury of a mighty dragon and manifest incredible abilities.}"
          - field: barbarian-dragon-instinct-type
            label: "_{Dragon type}"
            size: huge
            width: stretch
            align: left
          - field: barbarian-dragon-instinct-rel
            value: respect
            control: radio
            frame: right
            label: "_{You respect this dragon type}"
          - field: barbarian-dragon-instinct-rel
            value: abhor
            control: radio
            frame: right
            label: "_{You abhor this dragon type}"
      - g:
        contents:
          - h5: "_{Anathema}"
          - ul:
            contents:
              - li: "_{Letting a personal insult against you slide.}"
              - field: barbarian-dragon-instinct-anathema
                value: respect
                control: radio
                frame: right
                label: "_{Defying this dragon type}"
              - field: barbarian-dragon-instinct-anathema
                value: abhor
                control: radio
                frame: right
                label: "_{Failing to defeat this dragon type}"
          - paste: barbarian-anathema-consequence

  - at: '@barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@archetype/barbarian/instinct-ability'
    replace:
      - nothing:

  - at: '@barbarian/specialisation-ability'
    replace:
      - nothing:

  - at: '@barbarian/specialisation-ability/greater'
    replace:
      - nothing:

  - at: '@barbarian/left'
    add:
      - section: "[b]_{Draconic Rage!}[/b]"
        id: draconic-rage
        contents:
          - list:
            hr: true
            contents:
              - g:
                contents:
                  # CRB p87 instinct ability missing?
                  - p: "_{While raging, you can increase your additional damage from [b]Rage![/b] from 2 to 4 and change its damage type to match that of your dragon's breath weapon instead of the damage type for your weapon or unarmed attack. If you do, your [b]Rage![/b] action gains the arcane and evocation traits, as well as the trait matching the damage type.}"
                  - row:
                    contents:
                      - field: "##:breath/shape"
                        control: radio
                        frame: right
                        label: "_{Cone}"
                      - field: "##:breath/shape"
                        control: radio
                        frame: right
                        label: "_{Line}"
                  - field: barbarian-dragon-instinct-damage-type
                    label: "_{Damage Type}"
                    width: stretch
                  - indent: left
                    contents:
                      - field: barbarian-bestial-rage-damage-bonus
                        label: "_{[b]Draconic Rage![/b] Damage Bonus}"
                        # border: full
                        frame: right
                        control: value
                        width: large
                        value: "+4"

              - level: 7
                contents:
                  - h5: "_{Weapon Specialisation}"
                  - field: barbarian-bestial-rage-damage-bonus-spec
                    label: "_{[b]Draconic Rage![/b] Damage Bonus}"
                    # border: full
                    frame: right
                    control: value
                    width: large
                    value: "+8"

              - level: 15
                contents:
                  - h5: "_{Greater Weapon Specialisation}"
                  - field: barbarian-bestial-rage-damage-bonus-greater
                    label: "_{[b]Draconic Rage![/b] Damage Bonus}"
                    # border: full
                    frame: right
                    control: value
                    width: large
                    value: "+16"

  - at: '@archetype/barbarian/rage-power'
    add:
      # sync: reuse the @barbarian/left block via zone
      - zone: '@barbarian/left'

  - at: '@barbarian/raging-resistance'
    replace:
      # sync: make into a checkbox field like other classes
      - field: barbarian-raging-resistance-piercing
        control: checkbox
        value: true
        frame: right
        label: "_{Piercing}"
      - field: barbarian-raging-resistance-breath-weapon
        label: "_{Breath weapon damage type}"
        width: stretch
