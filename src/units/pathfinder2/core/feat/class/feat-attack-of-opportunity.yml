unit: feat/attack-of-opportunity
name: "_{Attack of Opportunity}"
group: "_{Core Rulebook}"

inc:
  - copy: feat/attack-of-opportunity
    contents:
      - article:
        title: "_{Attack of Opportunity}"
        cat: "_{Feat}"
        contents:
          - action: reaction
            contents:
              - dl:
                  trigger: "_{A creature within your reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.}"
              - p: "_{Make a melee Strike against the triggering creature.}"
              - dl:
                  critical_failure: "_{Disrupts a manipulate-action trigger.}"
              - p: "_{This Strike doesn't count toward your multiple attack penalty, and your multiple attack penalty doesn't apply to this Strike.}"
