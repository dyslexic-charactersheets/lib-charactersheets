unit: defs/dcs
group: "_{Core Rulebook}"

inc:
  - copy: unarmed-proficiency-override
    params:
      thresholds: ''
    contents:
      - at: '@weapon-proficiency/unarmed'
        replace:
          - field: unarmed-attack-proficiency
            control: proficiency
            frame: right
            has-bonus: false
            border: none
            label: "_{Unarmed}"
            eq: "proficiencyThreshold(defaultValue(%{level!},1),#{thresholds})"

  - copy: simple-weapons-proficiency-override
