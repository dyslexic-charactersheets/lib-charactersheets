        replace:
          - field: heavy-armour-proficiency
            control: proficiency
            frame: right
            has-bonus: false
            border: none
            label: "_{Heavy}"
            eq: "proficiencyThreshold(defaultValue(%{level!},1),#{thresholds})"

  - copy: saving-throw-override
    params:
      save: ''
      thresholds: ''
    contents:
      - at: "@saving-throw-proficiency/#{save}"
        replace:
          - field: "#{save}-proficiency"
            control: proficiency
            eq: "proficiencyThreshold(defaultValue(%{level!},1),#{thresholds})"

  - copy: class-dc-proficiency-override
    params:
      class: ''
      thresholds: ''
    contents:
      - at: "@class-dc-proficiency/#{class}-class-dc"
        replace:
          - field: "#{class}-class-dc-proficiency"
            label: "_{Proficiency}"
            control: proficiency
            eq: "proficiencyThreshold(defaultValue(%{level!},1),#{thresholds})"

  - copy: class-dc
    params:
      id: class-dc
      legend: "_{Class DC}"
      ability: ''
      misc: true
    contents:
      - calc:
        output:
          field: "#{id}"
          legend: "#{legend}"
          underlay: "_{DC}"
          width: large
          icon: dc
          eq: "10+%{#{id}-ability}+%{#{id}-proficiency-bonus}+%{#{id}-misc}"
        inputs:
          - span: 10 +
          - if: "#{ability}=="
            then:
              - field: "#{id}-ability"
                label: "_{Key Ability}"
                ref: "=key-ability"
                misc: true
            else:
              - field: "#{id}-ability"
                label: "_{#{ability}}"
                underlay: "_{#{ability}}"
                ref: "#{ability}"
                misc: true
          - span: "+"
            optional: true
          - zone: '@class-dc-proficiency/#{id}'
            contents:
              - field: "#{id}-proficiency"
                label: "_{Proficiency}"
                control: proficiency
          - if: "#{misc}"
            then:
              - span: "+"
                optional: true
              - field: "#{id}-misc"
                label: "_{Misc}"
                misc: true
                optional: true

  - copy: spell-attack
    params:
      id: spell-attack
      legend: "_{Spell\nAttack}"
      ability: ""
      misc: true
    contents:
      - calc:
        output:
          field: "#{id}"
          legend: "#{legend}"
          width: large
          overprint: true
          icon: bonus
          format: modifier
          eq: '%{#{id}-ability}+%{#{id}-proficiency-bonus}+%{#{id}-misc}'
        inputs:
          - if: "#{ability}=="
            then:
              - field: "#{id}-ability"
                label: "_{Key Ability}"
                ref: "=key-ability"
                misc: true
            else:
              - field: "#{id}-ability"
                label: "_{#{ability}}"
                underlay: "_{#{ability}}"
                ref: "#{ability}"
                misc: true
          - span: "+"
          - field: "#{id}-proficiency"
            label: "_{Proficiency}"
            control: proficiency
          - if: "#{misc}"
            then:
              - span: "+"
                optional: true
              - field: "#{id}-misc"
                label: "_{Misc}"
                misc: true
                optional: true

  - copy: spell-dc
    params:
      id: spell-dc
      legend: "_{Spell Save DC}"
      ability: ""
      misc: true
    contents:
      - calc:
        output:
          field: "#{id}"
          legend: "#{legend}"
          underlay: "_{DC}"
          width: large
          overprint: true
          icon: dc
          eq: '10+%{#{id}-ability}+%{#{id}-proficiency-bonus}+%{#{id}-misc}'
        inputs:
          - span: 10 +
          - if: "#{ability}=="
            then:
              - field: "#{id}-ability"
                label: "_{Key Ability}"
                ref: "=key-ability"
                misc: true
            else:
              - field: "#{id}-ability"
                label: "_{#{ability}}"
                underlay: "_{#{ability}}"
                ref: "#{ability}"
                misc: true
          - span: "+"
          - field: "#{id}-proficiency"
            label: "_{Proficiency}"
            control: proficiency
          - if: "#{misc}"
            then:
              - span: "+"
                optional: true
              - field: "#{id}-misc"
                label: "_{Misc}"
                misc: true
                optional: true

  - copy: arcane-spell-dcs
    params:
      ability: ''
    contents:
      - paste: spell-attack
        params:
          id: arcane-spell-attack
          legend: "_{Arcane Spell\nAttack}"
          ability: "#{ability}"
      - paste: spell-dc
