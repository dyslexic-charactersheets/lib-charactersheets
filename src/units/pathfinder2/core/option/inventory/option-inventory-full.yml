unit: option/inventory/full
in: option/inventory
name: "_{Inventory (full size)}"
group: "_{Core Rulebook}"

inc:
  - at: '@pages'
    add:
      - page: inventory
        name: "_{Inventory}"
        order: 16
        flex: true
        contents:
          - layout: 2l
            contents:
              - g:
                contents:
                  - section: "_{Inventory}"
                    id: inventory
                    contents:
                      - list:
                        hr: true
                        contents:
                          - g:
                            merge-bottom: true
                            contents:
                              - h5: "_{Items}"
                              - layout: 2e
                                gutter: small
                                contents:
                                  - repeat: 2
                                    reduce: 1
                                    contents:
                                      - g:
                                        id: "inventory-large-#{i}-mark"
                                        mark: hand-left
                                        mark-size: small
                                        contents:
                                          - article: inventory-item-large-#{i}
                                            no-header-line: true
                                            merge-bottom: false
                                            header:
                                              - row:
                                                contents:
                                                  - field: inventory-item-large-#{i}
                                                    width: stretch
                                                    frame: none
                                              - row:
                                                contents:
                                                  - field: inventory-item-large-#{i}-checked
                                                    label: "_{Readied}"
                                                    control: checkbox
                                                  - field: inventory-item-large-#{i}-value
                                                    format: string
                                                    label: "_{Value}"
                                                  - field: inventory-item-large-#{i}-weight
                                                    format: string
                                                    label: "_{Weight}"
                                            lines: 3
                                            min-lines: 3
                              - hr:

                              - g:
                                mark: inventory
                                contents:
                                  - list:
                                    zebra: true
                                    collapse: true
                                    contents:
                                      - row:
                                        contents:
                                          - field: inventory-item-1-checked
                                            label: "_{Readied}"
                                            control: checkbox
                                          - field: inventory-item-1
                                            width: stretch
                                          - field: inventory-item-1-value
                                            format: string
                                            label: "_{Value}"
                                          - field: inventory-item-1-weight
                                            format: string
                                            label: "_{Weight}"
                                      - repeat: 7
                                        start: 2
                                        reduce: 4
                                        contents:
                                          - row:
                                            contents:
                                              - field: inventory-item-#{i}-checked
                                                frame: none
                                                control: checkbox
                                              - field: inventory-item-#{i}
                                                width: stretch
                                              - field: inventory-item-#{i}-value
                                                format: string
                                              - field: inventory-item-#{i}-weight
                                                format: string

                          - g:
                            id: inventory-backpack-block
                            merge-bottom: true
                            contents:
                              - section: "_{Backpack}"
                                primary: true
                                mark: backpack
                                contents:
                                  - list:
                                    zebra: true
                                    collapse: true
                                    contents:
                                      - row:
                                        contents:
                                          - field: inventory-backpack-1
                                            width: stretch
                                          - field: inventory-backpack-1-value
                                            format: string
                                            label: "_{Value}"
                                          - field: inventory-backpack-1-weight
                                            format: string
                                            label: "_{Weight}"
                                      - repeat: 15
                                        start: 2
                                        reduce: 2
                                        contents:
                                          - row:
                                            contents:
                                              - field: inventory-backpack-#{i}
                                                width: stretch
                                              - field: inventory-backpack-#{i}-value
                                                format: string
                                              - field: inventory-backpack-#{i}-weight
                                                format: string
                                  - hr:
                                  - zone: '@inventory/kit'
                                    contents:
                                      - list:
                                        flex: small
                                        zebra: true
                                        contents:
                                          - row:
                                            contents:
                                              - field: inventory-kit
                                                width: stretch
                                                legend: "_{Kit}"
                                              - field: inventory-kit-value
                                                format: string
                                                label: "_{Value}"
                                              - field: inventory-kit-weight
                                                format: string
                                                label: "_{Weight}"
                                          - repeat: 4
                                            reduce: 2
                                            merge-bottom: true
                                            contents:
                                              - field: inventory-kit-contents-#{i}
                                                frame: none
                                                width: stretch
                                  - row:
                                    contents:
                                      - field: weight-backpack-ignore
                                        control: value
                                        value: "-2"
                                        frame: none
                                        width: tiny
                                      - p: "_{Bulk}"
                                      - spacer:
                                      - field: weight-backpack-total
                                        frame: left
                                        label: ""
                                        border: full
                                        control: weight
                          - g:
                            mark: expendables
                            flex: tiny
                            contents:
                              - h5: "_{Expendables}"
                              - list:
                                zebra: true
                                collapse: true
                                merge-bottom: true
                                contents:
                                  - repeat: 3
                                    contents:
                                      - row:
                                        contents:
                                          - field: expendable-#{i}
                                            width: stretch
                                          - field: expendable-#{i}-count
                                            frame: none
                                            control: checkgrid
                                            max: 20
                                            depth: 3

                          - g:
                            contents:
                              - zone: '@inventory/encumberance'
                                contents:
                                  - row:
                                    contents:
                                      - calc:
                                        output:
                                          field: encumberance-immobile
                                          label: "_{Max Bulk}"
                                          suffix: "_{B}"
                                          width: stretch
                                          eq: "10+%{STR}"
                                        inputs:
                                          - span: "10 +"
                                          - field:
                                            ref: STR
                                            label: "_{STR}"
                                            underlay: "_{STR}"
                                            width: small
                                      - calc:
                                        output:
                                          field: encumberance
                                          label: "_{Encumberance}"
                                          suffix: "_{B}"
                                          width: stretch
                                          eq: "5+%{STR}"
                                        inputs:
                                          - span: "5 +"
                                          - field:
                                            ref: STR
                                            label: "_{STR}"
                                            underlay: "_{STR}"
                                            width: small
                              - g:
                                pad: true
                                flex: none
                                contents:
                                  - row:
                                    contents:
                                      - field: gold-total
                                        align: right
                                        frame: left
                                        label: "_{Total wealth}"
                                        suffix: "_{gp}"
                                        border: full
                                        format: decimal
                                        width: gargantuan
                                      - spacer:
                                  - row:
                                    contents:
                                      - field: weight-total
                                        frame: left
                                        label: "_{Total weight}"
                                        border: full
                                        control: weight
                                      - spacer:
                                      - p: "_{10 light = 1 bulk}"
                                        optional: true
                  - tail:

              - g:
                contents:
                  - layout: 2e
                    flex: huge
                    contents:
                      - g:
                        contents:
                          - g:
                            contents:
                              - section: "_{Armour}"
                                primary: true
                                mark: armour
                                contents:
                                  - zone: '@armour'
                                    contents:
                                      - field: armour
                                        frame: none
                                        size: large
                                        width: stretch
                                        label: "&nbsp;"
                                      - row:
                                        contents:
                                          - field: ac-armour-bonus
                                            label: "_{AC Bonus}"
                                            icon: armour
                                            border: full
                                            format: int
                                            colour: DEX
                                          - field: ac-armour-potency
                                            control: counter
                                            label: "_{Potency}"
                                          - field: armour-runes
                                            label: "_{Runes}"
                                            width: stretch
                                            align: center
                                      - row:
                                        contents:
                                          - field: armour-cat
                                            label: "_{Category}"
                                            width: stretch
                                          - field: armour-value
                                            label: "_{Value}"
                                            format: int
                                          - field: armour-bulk
                                            label: "_{Weight}"
                                            format: int
                                      - row:
                                        layout: split
                                        contents:
                                          - field: armour-dex-cap
                                            label: "_{DEX\nCap}"
                                            format: int
                                            colour: DEX
                                          - field: armour-str-rating
                                            label: "_{Strength\nRating}"
                                            format: int
                                            # prefix: "+"
                                            colour: STR
                                          - field: armour-acp
                                            label: "_{Check\nPenalty}"
                                            border: full
                                            prefix: "&ndash;"
                                            format: int
                                          - zone: '@inventory/armour-speed-penalty'
                                            contents:
                                              - field: armour-speed-penalty
                                                label: "_{Speed\nPenalty}"
                                                width: large
                                                prefix: "&ndash;"
                                                suffix: "_{ft}"
                                                format: int
                                      - field: armour-properties
                                        width: stretch
                                        label: "_{Armour Traits}"
                                        repeat: 2
                                        reduce: 1
                                        # merge-bottom: true
                                      - row:
                                        contents:
                                          - field: armour-flexible
                                            control: checkbox
                                            frame: right
                                            label: "_{Flexible}"
                                            
                                          - field: armour-noisy
                                            control: checkbox
                                            frame: right
                                            label: "_{Noisy}"

                              - section: "_{Shield}"
                                mark: shield
                                contents:
                                  - row:
                                    layout: split
                                    contents:
                                      - field: shield
                                        frame: none
                                        size: large
                                        width: stretch
                                      - field: shield-value
                                        label: "_{Value}"
                                        format: int
                                      - field: shield-bulk
                                        label: "_{Weight}"
                                        format: int
                                  - row:
                                    contents:
                                      - field: shield-ac
                                        label: "_{AC Bonus}"
                                        icon: shield
                                        border: full
                                        format: int
                                        colour: DEX
                                      - field: shield-hardness
                                        label: "_{Hardness}"
                                        width: large
                                        suffix: "_{hp}"
                                        format: int
                                      # - spacer:
                                      - field: shield-bt
                                        label: "_{Broken}"
                                        suffix: "_{hp}"
                                        prefix: "&le;"
                                        width: large
                                        optional: true
                                        eq: "floor(%{shield-hp}/2)"
                                      # - spacer:
                                      - field: shield-hp
                                        label: "_{Hit Points}"
                                        icon: hp
                                        border: full
                                        suffix: "_{hp}"
                                        format: int
                                        colour: CON
                                  - field: shield-properties
                                    width: stretch
                                    label: "_{Shield Traits}"
                                    repeat: 2
                                    reduce: 1
                                    merge-bottom: true

                              - tail:

                              - portrait: personal
                                overprint: true

                              - section: "_{Money}"
                                flex: none
                                contents:
                                  - g:
                                    blk: true
                                    contents:
                                      - field: money-platinum
                                        frame: left
                                        control: money
                                        label: "_{Platinum}"
                                        denomination: platinum
                                        digits: 6
                                        shift: 3
                                      - field: money-gold
                                        frame: left
                                        control: money
                                        label: "_{Gold}"
                                        denomination: gold
                                        digits: 7
                                        shift: 2
                                      - field: money-silver
                                        frame: left
                                        control: money
                                        label: "_{Silver}"
                                        denomination: silver
                                        digits: 8
                                        shift: 1
                                      - field: money-copper
                                        frame: left
                                        control: money
                                        label: "_{Copper}"
                                        denomination: copper
                                        digits: 9
                                      - field: money-total
                                        frame: left
                                        output: 'true'
                                        control: money
                                        legend: "_{Total}"
                                        denomination: copper
                                        digits: 9
                                        decimal: 1
                                        eq: "(%{money-platinum}*1000)+(%{money-gold}*100)+(%{money-silver}*10)+%{money-copper}"
                                  - p: "_{1000 coins = 1 bulk}"
                                    optional: true
                              - section: "_{Scrolls}"
                                flex: none
                                mark: scroll
                                contents:
                                  - list:
                                    merge-bottom: true
                                    zebra: true
                                    avoid-shade: true
                                    contents:
                                      - repeat: 6
                                        reduce: 1
                                        contents:
                                          - row:
                                            blk: false
                                            contents:
                                              - field: inventory-scrolls-#{i}
                                                frame: none
                                                width: stretch
                                              - field: inventory-scrolls-#{i}-use
                                                control: checkbox
                                                frame: none
                              - tail:

                      - g:
                        id: inventory-invested-column
                        contents:
                          - section: "_{Invested Items}"
                            id: inventory-invested
                            contents:
                              - list:
                                zebra: true
                                flex: true
                                hr: true
                                merge-bottom: true
                                contents:
                                  - level: '1'
                                    marker: ''
                                    contents:
                                      - article: 'inventory-invested-1'
                                        blk: false
                                        no-header-line: true
                                        lines: 3
                                        show-level: true
                                        header:
                                          - row:
                                            blk: false
                                            contents:
                                              - field: 'inventory-invested-1'
                                                width: stretch
                                                frame: none
                                              - field: 'inventory-invested-1-value'
                                                format: string
                                                label: "_{Value}"
                                              - field: 'inventory-invested-1-weight'
                                                format: string
                                                label: "_{Weight}"
                                  - repeat: 9
                                    start: 2
                                    contents:
                                      - level: '#{i}'
                                        marker: ''
                                        contents:
                                          - article: 'inventory-invested-#{i}'
                                            blk: false
                                            no-header-line: true
                                            lines: 3
                                            show-level: true
                                            header:
                                              - row:
                                                blk: false
                                                contents:
                                                  - field: 'inventory-invested-#{i}'
                                                    width: stretch
                                                    frame: none
                                                  - field: 'inventory-invested-#{i}-value'
                                                    format: string
                                                  - field: 'inventory-invested-#{i}-weight'
                                                    format: string
                          - section: "_{Potions}"
                            flex: none
                            mark: potion
                            contents:
                              - list:
                                merge-bottom: true
                                zebra: true
                                avoid-shade: true
                                contents:
                                  - repeat: 10
                                    reduce: 2
                                    contents:
                                      - row:
                                        blk: false
                                        contents:
                                          - field: inventory-potion-#{i}
                                            width: stretch
                                            frame: none
                                          - field: inventory-potion-#{i}-count
                                            underlay: "#"
                                            frame: none
                                            format: int
                                          - field: inventory-potion-#{i}-use
                                            frame: none
                                            control: checkgrid
                                            max: 6
                                            depth: 2
                          - tail:
