unit: archetype/fighter
in: archetype
group: "_{Core Rulebook}"
name: "_{Fighter}"
multiclass: true

require:
  - unit: feat/attack-of-opportunity

inc:
  - set: fighter-class-dc-proficiency
    value: trained

  - at: '@archetypes'
    add:
      - name: "_{Fighter}"
        num-feats: 3

  - at: '@pages'
    add:
      - page: archetype-fighter
        name: "_{Fighter}"
        order: 26
        flex: true
        half: true
        contents:
          - layout: 2e
            contents:
              - g:
                contents:
                  - g:
                    flex: tiny
                    contents:
                      - class-icon: fighter
                      - class-name: "_{Fighter}"
                  - section: "_{Dedication}"
                    contents:
                      - p: "_{Trained in simple and martial weapons}"
                        icon: proficiency-trained
                      - p: "_{Trained in either Acrobatics or Athletics}"
                        icon: proficiency-trained
                      - hr:
                      - paste: class-dc
                        params:
                          id: fighter-class-dc
                          legend: "_{Fighter\nClass DC}"
                          misc: false

                  - section: "_{Archetype Feats}"
                    contents:
                      - list:
                        hr: true
                        contents:
                          - article: "##:fighter-resiliency"
                            title: "_{Fighter Resiliency}"
                            cat: "_{Feat} 4"
                            contents:
                              - paste: archetype-resiliency
                                params:
                                  class-id: fighter
                                  class-feats: "_{Fighter Feats}"
                          - article: "##:opportunist"
                            title: "_{Opportunist}"
                            cat: "_{Feat} 4"
                            contents:
                              - selectable: "##:opportunist"
                                contents:
                                  - paste: attack-of-opportunity
                          - article: "##:diverse-weapon-expert"
                            title: "_{Diverse Weapon Expert}"
                            cat: "_{Feat} 12"
                            contents:
                              - selectable: "##:diverse-weapon-expert"
                                contents:
                                  - p: "_{Expert in simple and martial weapons}"
                                    icon: proficiency-expert
                                  - p: "_{Trained in advanced weapons}"
                                    icon: proficiency-trained

                  - tail:
                  - spacer:
                    flex: huge

              - g:
                contents:
                  - section: "_{Manoeuvres}"
                    mark: fighter
                    contents:
                      - paste: archetype-feats
                        params:
                          id: fighter-feats
                          class-level: "_{Fighter\nLevel}"
                          basic-title: "_{Basic Manoeuvre}"
                          advanced-title: "_{Advanced Manoeuvres}"

                  - tail:

